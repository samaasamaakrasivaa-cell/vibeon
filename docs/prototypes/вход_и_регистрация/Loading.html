<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Загрузка кабинета</title>


<style>
body{margin:0;background:#FFFFFF}
@keyframes vbar{0%,100%{transform:scaleY(1)}50%{transform:scaleY(0.45)}}
.vb{transform-box:fill-box;transform-origin:center;animation:vbar 1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.vb{animation:none}}
</style>
</head>
<body>


<div style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Arial, sans-serif; color: #1C1C1E; background: #FFFFFF; min-height: 860px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
<svg width="96" height="96" viewBox="0 0 32 32" role="img" aria-label="VibeOn загружается"><defs><linearGradient id="lgl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B9A"></stop><stop offset="0.5" stop-color="#A55CF5"></stop><stop offset="1" stop-color="#3D8BFF"></stop></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lgl)"></rect><g fill="#FFFFFF"><rect class="vb" x="6.5" y="8" width="2.5" height="16" rx="1.25" style="animation-delay: 0s"></rect><rect class="vb" x="10.75" y="10.5" width="2.5" height="11" rx="1.25" style="animation-delay: 0.12s"></rect><rect class="vb" x="15" y="13" width="2.5" height="6" rx="1.25" style="animation-delay: 0.24s"></rect><rect class="vb" x="19.25" y="10.5" width="2.5" height="11" rx="1.25" style="animation-delay: 0.36s"></rect><rect class="vb" x="23.5" y="8" width="2.5" height="16" rx="1.25" style="animation-delay: 0.48s"></rect></g></svg>
<span style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em">VibeOn</span>
<span style="font-size: 15px; color: #6E6E73">Открываем ваш кабинет…</span>
</div>


</body>
</html>
