<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VibeOn — lesson builder</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<style>
:root{
  --bg:#F2F2F7;--surface:#FFFFFF;--surface2:#F2F2F7;--fill:#E3E3E8;--seg-on:#FFFFFF;
  --text:#1C1C1E;--text2:#6C6C70;--text3:#8E8E93;--sep:#E5E5EA;
  --accent:#007AFF;--accent-bg:#E5F0FF;--accent-text:#0057B8;--on-accent:#FFFFFF;
  --ok:#34C759;--ok-bg:#E8F8EC;--ok-text:#1E7B34;
  --bad:#FF3B30;--bad-bg:#FDECEB;--bad-text:#C4161C;
  --warn:#FF9500;--warn-bg:#FFF4E0;--warn-text:#8A5300;
  --grey:#C7C7CC;--grey-bg:#F2F2F7;--grey-text:#6C6C70;
  --violet:#5856D6;--violet-bg:#EEEDFF;
  --bar:rgba(242,242,247,.86);--shade:rgba(120,120,128,.08);--switch:#34C759;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#1C1C1E;--surface2:#2C2C2E;--fill:#2C2C2E;--seg-on:#636366;
    --text:#F2F2F7;--text2:#AEAEB2;--text3:#8E8E93;--sep:#38383A;
    --accent:#0A84FF;--accent-bg:#0B2B50;--accent-text:#7DB8FF;--on-accent:#FFFFFF;
    --ok:#30D158;--ok-bg:#0F2E18;--ok-text:#5BE38A;
    --bad:#FF453A;--bad-bg:#3B1514;--bad-text:#FF8A82;
    --warn:#FF9F0A;--warn-bg:#3A2A0C;--warn-text:#FFC266;
    --grey:#636366;--grey-bg:#2C2C2E;--grey-text:#AEAEB2;
    --violet:#8E8CFF;--violet-bg:#25244A;
    --bar:rgba(0,0,0,.82);--shade:rgba(255,255,255,.04);--switch:#30D158;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1C1C1E;--surface2:#2C2C2E;--fill:#2C2C2E;--seg-on:#636366;
  --text:#F2F2F7;--text2:#AEAEB2;--text3:#8E8E93;--sep:#38383A;
  --accent:#0A84FF;--accent-bg:#0B2B50;--accent-text:#7DB8FF;--on-accent:#FFFFFF;
  --ok:#30D158;--ok-bg:#0F2E18;--ok-text:#5BE38A;
  --bad:#FF453A;--bad-bg:#3B1514;--bad-text:#FF8A82;
  --warn:#FF9F0A;--warn-bg:#3A2A0C;--warn-text:#FFC266;
  --grey:#636366;--grey-bg:#2C2C2E;--grey-text:#AEAEB2;
  --violet:#8E8CFF;--violet-bg:#25244A;
  --bar:rgba(0,0,0,.82);--shade:rgba(255,255,255,.04);--switch:#30D158;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
.nav{background:var(--bg);border-right:.5px solid var(--sep);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-weight:600;font-size:15px;padding:0 10px 16px}
.navb{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-size:15px;text-align:left;min-height:40px}
.navb:hover{background:var(--fill)}
.navb[aria-current="page"]{background:var(--accent-bg);color:var(--accent);font-weight:600}
.navb .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 7px}
.navfoot{margin-top:auto;font-size:12px;color:var(--text3);padding:0 10px;line-height:1.4}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:.5px solid var(--sep);z-index:5;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .brand,.navfoot{display:none}
  .navb{width:auto;white-space:nowrap}
}
.main{padding:28px 32px 64px;min-width:0}
@media (max-width:820px){.main{padding:20px 16px 48px}}
.page{max-width:980px;margin:0 auto}
.kicker{font-size:13px;color:var(--text3)}
h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0}
h3{font-size:13px;font-weight:600;color:var(--text2);margin:0 0 10px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:22px}
.head .grow{flex:1}
.sec{margin-top:28px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:.5px solid var(--sep);min-height:60px}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--text2)}
.linkish{border:0;background:none;padding:0;font-weight:600;text-align:left;color:var(--text)}
.linkish:hover{color:var(--accent)}
.time{min-width:96px;font-variant-numeric:tabular-nums}
.time b{display:block;font-weight:600}
.time span{font-size:12px;color:var(--text3)}
.row.soon{box-shadow:inset 3px 0 0 var(--accent)}
.soonlabel{color:var(--accent);font-weight:600}

.btn{border:0;border-radius:20px;min-height:40px;padding:0 18px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.secondary{background:var(--fill);color:var(--text)}
.btn.plain{background:transparent;color:var(--accent);padding:0 8px}
.btn.small{min-height:32px;padding:0 12px;font-size:13px;border-radius:16px}
.btn.danger{background:transparent;color:var(--bad-text)}
.iconb{border:0;background:var(--fill);width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok-text)}
.p-review{background:var(--accent);color:var(--on-accent)}
.p-up{background:var(--accent-bg);color:var(--accent-text)}
.p-bad{background:var(--bad-bg);color:var(--bad-text)}
.p-warn{background:var(--warn-bg);color:var(--warn-text)}
.p-grey{background:var(--grey-bg);color:var(--grey-text)}
.p-violet{background:var(--violet-bg);color:var(--violet)}

.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;font-size:13px;padding:0 14px;min-height:30px;border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--seg-on);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.banner{display:flex;align-items:center;gap:10px;background:var(--violet-bg);color:var(--violet);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:18px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border:0;background:var(--surface);border-radius:12px;padding:10px 6px;text-align:center;min-height:64px}
.day .d{font-size:12px;color:var(--text3)}
.day .n{font-size:14px;font-weight:600;margin-top:2px}
.day.today .d{color:var(--accent);font-weight:600}
.day[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.day[aria-pressed="true"] .d{color:var(--on-accent)}
@media (max-width:560px){.day .n{font-size:12px}}
.empty{padding:22px 18px;text-align:center;color:var(--text2);font-size:14px}

/* schedule */
.calwrap{background:var(--surface);border-radius:14px;padding:12px 12px 14px;overflow-x:auto}
.cal{display:grid;grid-template-columns:44px repeat(7,minmax(96px,1fr));min-width:740px}
.calh{text-align:center;font-size:13px;padding:2px 0 10px;color:var(--text2)}
.calh.today span{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:3px 10px;font-weight:600}
.hours{position:relative}
.hours span{position:absolute;right:8px;font-size:11px;color:var(--text3);transform:translateY(-50%)}
.col{position:relative;border-left:.5px solid var(--sep);background-image:repeating-linear-gradient(to bottom,var(--sep) 0,var(--sep) .5px,transparent .5px,transparent 44px);cursor:copy}
.past{position:absolute;left:0;right:0;top:0;background:var(--shade);pointer-events:none}
.ev{position:absolute;left:3px;right:3px;border:0;border-radius:7px;padding:4px 6px 4px 8px;text-align:left;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.ev b{font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{font-size:11px;opacity:.8}
.ev .dot{width:7px;height:7px;border-radius:50%;flex:none}
.ev.upcoming,.ev.live{background:var(--accent-bg);color:var(--accent-text);box-shadow:inset 3px 0 0 var(--accent)}
.ev.done{background:var(--ok-bg);color:var(--ok-text);box-shadow:inset 3px 0 0 var(--ok)}
.ev.cancelled{background:var(--warn-bg);color:var(--warn-text);box-shadow:inset 3px 0 0 var(--warn)}
.ev.cancelled b span.nm{text-decoration:line-through}
.ev.missed{background:var(--bad-bg);color:var(--bad-text);box-shadow:inset 3px 0 0 var(--bad)}
.nowline{position:absolute;left:44px;right:0;height:1.5px;background:var(--bad);pointer-events:none;z-index:2}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* students */
.av{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.av.lg{width:64px;height:64px;font-size:24px}
.packmini{text-align:right;min-width:150px}
.packmini .s{font-size:12px}
.bar{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:5px}
.bar div{height:5px;border-radius:3px;background:var(--accent)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:10px;padding:0 12px;min-height:38px;min-width:220px;color:var(--text3)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;color:var(--text)}
.profile{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:20px}
.profile .grow{flex:1;min-width:200px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:14px}
.kv dt{color:var(--text2)}
.kv dd{margin:0;word-break:break-word}
.notes{width:100%;min-height:90px;resize:vertical;border:0;border-radius:10px;background:var(--warn-bg);color:var(--text);padding:10px 12px;font-size:14px;line-height:1.5}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border-radius:14px;padding:14px 16px}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.tile .l{font-size:13px;color:var(--text2)}
.skill{display:grid;grid-template-columns:90px minmax(0,1fr) 80px;gap:12px;align-items:center;font-size:14px;padding:6px 0}
.skill .track{position:relative;height:8px;border-radius:4px;background:var(--fill)}
.skill .fillb{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.skill .target{position:absolute;top:-4px;width:2px;height:16px;background:var(--text);border-radius:1px}
.skill .val{text-align:right;color:var(--text2);font-variant-numeric:tabular-nums}

/* review & courses */
.answer{background:var(--surface2);border-radius:10px;padding:10px 12px;margin:6px 0 8px;font-size:15px}
.essay{background:var(--surface2);border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.65;margin:8px 0}
.field{width:100%;border:0;background:var(--surface2);border-radius:10px;padding:8px 12px;min-height:40px;font-size:15px}
textarea.field{min-height:110px;resize:vertical;line-height:1.5}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ctile{border:0;background:var(--surface);border-radius:16px;padding:0;text-align:left;overflow:hidden;min-height:150px;display:flex;flex-direction:column}
.ctile .cov{height:62px}
.ctile .body{padding:12px 14px}
.ctile .t{font-weight:600;font-size:16px}
.ctile .s{font-size:13px;color:var(--text2)}
.ctile.new{border:1.5px dashed var(--grey);background:transparent;align-items:center;justify-content:center;color:var(--accent);font-weight:600;gap:8px}
.ctile.new .plus{width:44px;height:44px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center}
.unit{margin-top:18px}

/* dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(440px,calc(100vw - 32px));background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:20px 22px 18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 60px);overflow-y:auto}
.dlg label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--text2)}
.dlg .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{border:0;background:var(--fill);border-radius:999px;padding:0 14px;min-height:34px;font-size:14px}
.chipsel button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:13px;background:var(--fill);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--switch)}
.switch:checked::after{transform:translateX(18px)}
.err{color:var(--bad-text);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}

.navsep{height:.5px;background:var(--sep);margin:12px 10px}
@media (max-width:820px){.navsep{width:.5px;height:24px;margin:8px 4px;flex:none}}
.thead,.trow{display:grid;grid-template-columns:96px minmax(0,1fr) 180px 140px;gap:14px;align-items:center;padding:0 16px}
.thead{font-size:12px;color:var(--text3);padding-top:10px;padding-bottom:6px;border-bottom:.5px solid var(--sep)}
.trow{min-height:64px;border-bottom:.5px solid var(--sep);padding-top:10px;padding-bottom:10px}
.trow:last-child{border-bottom:0}
.trow.soon{box-shadow:inset 3px 0 0 var(--accent)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who .linkish{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hwcell{display:flex}
.hwbtn{border:0;min-height:28px;cursor:pointer}
.hwbtn:hover{filter:brightness(.95)}
.acts2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:760px){.thead{display:none}.trow{grid-template-columns:70px minmax(0,1fr);row-gap:8px}.hwcell{grid-column:2}.acts2{grid-column:1 / -1;justify-content:flex-start}}
.thead2{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);padding:10px 16px 6px;border-bottom:.5px solid var(--sep)}
.earn{text-align:center;font-size:13px;font-weight:600;padding:10px 2px 4px;border-top:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.earn.zero{color:var(--text3);font-weight:400}
.earn.lbl{font-size:11px;color:var(--text3);font-weight:400;text-align:left;padding-left:0}
.nowline{right:0}
.note2{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.tblwrap{background:var(--surface);border-radius:14px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
.tbl th{font-size:12px;font-weight:600;color:var(--text3);text-align:left;padding:12px 14px 8px;border-bottom:.5px solid var(--sep);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:.5px solid var(--sep);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctiles{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ctile{flex-direction:row;align-items:center;gap:14px;padding:14px;min-height:0}
.ctile .body{padding:0;flex:1;min-width:0}
.ctile.new{flex-direction:column;min-height:126px}
.cover{flex:none;width:72px;height:96px;border-radius:6px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cover.lg{width:96px;height:128px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.checks{display:flex;flex-direction:column;gap:2px;max-height:190px;overflow-y:auto;background:var(--surface2);border-radius:10px;padding:8px 12px}
.checks label{display:flex;align-items:center;gap:10px;font-size:15px;padding:5px 0;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--accent)}

.plabel{font-size:11px;color:var(--text3);margin-bottom:3px}
.qprev{font-size:14px;margin-top:4px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px}
.qsent{font-size:17px;line-height:1.9}
.bub2{background:var(--surface2);border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.5;max-width:560px}
.bub2.me{background:var(--accent-bg);color:var(--text)}

.thead span:nth-child(3){padding-left:2px}
.acts2 .btn{width:100%}
.paylink{border:0;background:none;padding:0;font-size:12px;font-weight:600;color:var(--accent);text-align:right;cursor:pointer}
.paylink:hover{text-decoration:underline}
.paylink.bad{color:var(--bad-text)}

.onbwrap{display:none}

function buildCross(pairs){
  const ws=pairs.map(([w,c])=>({w:w.toUpperCase().replace(/[^A-Z]/g,""),c})).filter(x=>x.w.length>1).sort((a,b)=>b.w.length-a.w.length);
  if(!ws.length)return null;const grid=new Map(),placed=[];const key=(x,y)=>x+","+y;
  const can=(w,x,y,d)=>{for(let i=0;i<w.length;i++){const cx=x+(d?0:i),cy=y+(d?i:0);const g=grid.get(key(cx,cy));if(g&&g!==w[i])return false;if(!g){const n1=d?key(cx-1,cy):key(cx,cy-1),n2=d?key(cx+1,cy):key(cx,cy+1);if(grid.has(n1)||grid.has(n2))return false}}
    const b=d?key(x,y-1):key(x-1,y),a=d?key(x,y+w.length):key(x+w.length,y);return !grid.has(b)&&!grid.has(a)};
  const put=(o,x,y,d)=>{for(let i=0;i<o.w.length;i++)grid.set(key(x+(d?0:i),y+(d?i:0)),o.w[i]);placed.push({...o,x,y,d})};
  put(ws[0],0,0,0);
  ws.slice(1).forEach(o=>{let done=false;for(const p of placed){if(done)break;for(let i=0;i<p.w.length&&!done;i++)for(let j=0;j<o.w.length&&!done;j++){if(p.w[i]!==o.w[j])continue;const d=p.d?0:1;const x=p.d?p.x-j:p.x+i,y=p.d?p.y+i:p.y-j;if(can(o.w,x,y,d)){put(o,x,y,d);done=true}}}});
  const xs=[...grid.keys()].map(k=>+k.split(",")[0]),ys=[...grid.keys()].map(k=>+k.split(",")[1]);
  return{grid,placed,minX:Math.min(...xs),minY:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs)+1,h:Math.max(...ys)-Math.min(...ys)+1,left:ws.length-placed.length};
}

 "lead-in":[["Ask 2–3 personal questions on the topic: what do you think, have you ever…","Задайте 2–3 личных вопроса по теме: что вы думаете, бывало ли у вас…"],["Show a picture or a short quote and ask the student to guess the topic","Покажите картинку или короткую цитату и попросите угадать тему урока"]],
 "warm-up":[["Revise last lesson’s words with a quick game","Повторите слова прошлого урока в быстрой игре"],["A 2-minute speaking task to get the student talking","Короткое говорение на 2 минуты, чтобы «разговорить» ученика"]],
 "vocabulary":[["After a multiple choice, add Match pairs, then Gaps in a context","После теста добавьте «Соедини пары», а потом «Пропуски» в контексте"],["Finish with Speaking: the student uses 5 new words in their own sentences","Завершите говорением: ученик использует 5 новых слов в своих предложениях"],["Match the word to a picture works well for concrete nouns","«Слово к картинке» хорошо подходит для конкретных существительных"]],
 "grammar":[["Start with examples from the text, ask the student to spot the pattern","Начните с примеров из текста и попросите ученика найти закономерность"],["Controlled practice first, then freer practice","Сначала контролируемая практика, потом свободная"]],
 "reading":[["Before reading: predict the content from the title","До чтения: угадать содержание по заголовку"],["Gist question first, then True/False for details","Сначала вопрос на общее понимание, потом True/False на детали"]],
 "listening":[["Set a task before the first listening","Дайте задание до первого прослушивания"],["Second listening: gaps or dictation for details","Второе прослушивание: пропуски или диктант на детали"]],
 "speaking":[["Give a clear goal and useful phrases","Дайте понятную цель и полезные фразы"],["AI conversation partner for extra practice at home","ИИ-собеседник для дополнительной практики дома"]],
 "writing":[["Give a model text first","Сначала дайте образец текста"],["Essay with a word limit; AI pre-checks it for you","Эссе с лимитом слов; ИИ сделает предпроверку"]],
 "wrap-up":[["Ask: what are 3 things you learned today?","Спросите: какие 3 вещи вы сегодня узнали?"],["Quick self-check test of 3–5 questions","Короткий тест-самопроверка из 3–5 вопросов"]]};
const RTASKS={"lead-in":["speak","image"],"warm-up":["pairs","speak"],"vocabulary":["pairs","gap","picture","crossword"],"grammar":["gap","dropdown","transform"],"reading":["text","tf","test"],"listening":["audio","gap","dictation"],"speaking":["speak","record"],"writing":["essay","open"],"wrap-up":["test","open"]};
function rubricTips(){const sec=S.sections.find(x=>x.id===S.activeSec);const key=sec?Object.keys(RTIPS).find(k=>sec.title.toLowerCase().includes(k.replace("-",""))||sec.title.toLowerCase().includes(k)):null;
  const have=S.sections.map(x=>x.title.toLowerCase());
  return `<div class="rubbox"><div class="rubh"><b>${T("Lesson stages","Рубрики урока")}</b></div><div class="rubchips">${RUBRICS.filter(([en])=>!have.includes(en.toLowerCase())).map(([en])=>`<button class="rubchip" data-act="rubadd" data-v="${en}">+ ${en}</button>`).join("")}</div>
   ${key?`<div class="aitip"><div class="aith">${ic("spark","sm")}<b>${T(`AI tips for ${sec.title}`,`Подсказки ИИ: ${sec.title}`)}</b></div>${RTIPS[key].map(x=>`<div class="aiti">• ${esc(T(x[0],x[1]))}</div>`).join("")}<div class="aitasks">${(RTASKS[key]||[]).filter(k=>TYPES[k]).map(k=>`<button class="rubchip task" data-act="tipadd" data-v="${k}">+ ${esc(tn(k))}</button>`).join("")}</div></div>`:`<div class="aitip"><div class="aith">${ic("spark","sm")}<b>${T("AI tips","Подсказки ИИ")}</b></div><div class="aiti">${T("Name a section like a lesson stage (Lead-in, Vocabulary, Speaking…) to get tips and task ideas.","Назовите секцию как этап урока (Lead-in, Vocabulary, Speaking…), чтобы получить подсказки и идеи заданий.")}</div></div>`}</div>`}

function openDlg(h,wide){$("#dlgbody").innerHTML=h;dlg.classList.toggle("wide",!!wide);if(!dlg.open)dlg.showModal()}
function closeDlg(){if(dlg.open)dlg.close()}
dlg.addEventListener("click",e=>{if(e.target===dlg)closeDlg()});
const closeBtn=()=>`<button class="iconb" data-act="close" aria-label="${T("Close","Закрыть")}">${ic("x","sm")}</button>`;
function catCard(k){const fav=S.favs.includes(k);
  return `<div class="ccard"><button class="cpick" data-act="pick" data-v="${k}">${thumb(k)}<b>${tn(k)}</b></button><button class="fav ${fav?"on":""}" data-act="fav" data-v="${k}" aria-pressed="${fav}" aria-label="${T("Favourite","Избранное")}">${ic("heart","sm")}</button></div>`}
function classifyEx(txt){const L=txt.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(L.some(l=>/—\s*(T|F|NS)$/.test(l)))return "tf";if(/\[[^\]]*\/[^\]]*\]/.test(txt)&&/\*/.test(txt))return "dropdown";if(/\[[^\]]+\]/.test(txt))return "gap";
  if(L.length>1&&L.every(l=>/ [—-] /.test(l)))return "pairs";if(L.filter(l=>/\?$/.test(l)).length>=2)return "speak";return txt.length>400?"text":"open"}
function dAttach(){S.attTab=S.attTab||"type";openDlg(`<div class="sechead"><h2>${T("Attach an exercise","Прикрепить упражнение")}</h2><div style="flex:1"></div>${closeBtn()}</div>
  <div class="seg" style="width:100%">${[["type",T("Type","Напечатать")],["img",T("Photo","Картинка")],["file",T("File","Файл")]].map(([k,l])=>`<button style="flex:1" data-act="atttab" data-v="${k}" aria-pressed="${S.attTab===k}">${l}</button>`).join("")}</div>
  ${S.attTab==="type"?`<textarea class="field" id="atttxt" style="min-height:160px" placeholder="${T("Paste or type the exercise with its instruction. Mark correct answers in bold or with an asterisk.","Вставьте или напечатайте упражнение вместе с инструкцией. Правильные ответы отметьте жирным или звёздочкой.")}"></textarea>`:`<label class="drop">${ic(S.attTab==="img"?"image":"file")}<span>${S.attTab==="img"?T("Choose a photo or screenshot","Выберите фото или скриншот"):T("Choose Word, PDF or text","Выберите Word, PDF или текст")}</span><input type="file" class="sr" accept="${S.attTab==="img"?"image/*":".docx,.pdf,.txt,.md"}" data-act2="attfile"></label><textarea class="field" id="atttxt" style="min-height:110px;margin-top:10px" placeholder="${T("The recognised text appears here","Здесь появится распознанный текст")}"></textarea>`}
  <div class="s" id="attst"></div>
  <div class="acts"><button class="btn secondary" data-act="close">${T("Cancel","Отмена")}</button><button class="btn primary" data-act="attgo">${ic("spark","sm")}${T("Pick the task type","Подобрать задание")}</button></div>`,true)}
async function attachGo(){const txt=$("#atttxt").value.trim();if(!txt){$("#attst").textContent=T("Add the exercise first","Сначала добавьте упражнение");return}$("#attst").textContent=T("AI is choosing the task type…","ИИ подбирает тип задания…");let r=null;
  if(sampleFn){try{r=await sampleFn.json(`You convert an English-teaching exercise into a task for a lesson builder. Choose the best type from: gap (type the word: write the full sentence with the answer in [square brackets], optional hint in (round) brackets after it), dropdown (options in one bracket separated by " / " with * after the correct one), drag (same as gap, words go into a bank), tf (one statement per line ending with " — T", " — F" or " — NS"), pairs (one "word — definition" per line), sentence (one correct sentence per line), speak (one discussion question per line), open (one question per line), essay (a writing prompt), text (a reading text). Keep the instruction short as the title. Return ONLY JSON {"type":"...","title":"...","content":"..."}.\n\nExercise:\n${txt.slice(0,5000)}`,{modelTier:"quick"})}catch(e){if(e&&e.code==="not_granted")sampleFn=null}}
  if(!r||!TYPES[r.type]){const lines0=txt.split(/\n+/);const head=lines0.length>1&&!/[\[\]—]/.test(lines0[0])?lines0.shift():"";let body=lines0.join("\n").replace(/\*\*(.+?)\*\*/g,"[$1]");r={type:classifyEx(body),title:head,content:body}}
  closeDlg();newTask(r.type,S.catTarget||(S.activeSec+":"+9999),r.content);if(r.title){S.edit.title=r.title;dEditor()}toast(T(`AI picked: ${tn(r.type)}. Check and save.`,`ИИ выбрал: ${tn(r.type)}. Проверьте и сохраните.`))}
function dCatalog(){
  const q=S.catQ.toLowerCase();const match=k=>!q||TYPES[k].en.toLowerCase().includes(q)||TYPES[k].ru.toLowerCase().includes(q);const favs=[...new Set(S.favs.map(k=>k==="drag"?"gap":k))].filter(match);
  openDlg(`<div class="sechead"><h2>${T("Create task","Создать задание")}</h2><div style="flex:1"></div>${closeBtn()}</div>
   <button class="attachcard" data-act="attachex">${ic("spark")}<span><b>${T("Attach an exercise","Прикрепить упражнение")}</b><span class="s">${T("Type it, add a photo or a file. AI picks the right task type and fills it in.","Напечатайте, добавьте фото или файл. ИИ сам подберёт тип задания и заполнит его.")}</span></span>${ic("right","sm")}</button>
   <div class="catbar"><label class="search" style="flex:1">${ic("search","sm")}<span class="sr">${T("Search","Поиск")}</span><input id="catq" placeholder="${T("Search tasks","Поиск заданий")}" value="${esc(S.catQ)}" autocomplete="off"></label></div>
   ${favs.length?`<div class="cgroup"><div class="cgh">${ic("heart","sm")} ${T("Favourites","Избранное")}</div><div class="cgrid">${favs.map(catCard).join("")}</div></div>`:""}
   ${GROUPS.map(([g,en,ru])=>{const MORD=["image","text","audio","video","wordset","note","link"];const ks=Object.keys(TYPES).filter(k=>TYPES[k].g===g&&match(k)&&k!=="drag").sort((x,y)=>g==="media"?((MORD.indexOf(x)+1||99)-(MORD.indexOf(y)+1||99)):0);return ks.length?`<div class="cgroup"><div class="cgh">${T(en,ru)}</div><div class="cgrid">${ks.map(catCard).join("")}</div></div>`:""}).join("")||`<div class="empty">${T("Nothing found.","Ничего не найдено.")}</div>`}`,true);
}
const GAPMAKE=["gap","drag","dropdown"];

</svg>`:ic("key","sm")}</span><span class="sr">${T(en,ru)}</span></label>`}

1. Start each section with ## and its name:
## Lead-in
2. Start each task with ### and its instruction:
### Fill in the gaps.
3. Write the answers right in the text:
• gap: She [has lived](live) here. — (live) is a grey hint
• several right answers: [don't / do not]
• options: It’s fine to [make* / do / take] mistakes — * or bold = right
• true / false: statement — T, F or NS
• pairs: word — definition
• columns: Positive: proud, happy
• test: question, then options, right ones bold or with *; empty line between questions
• translation: Russian sentence → English answer
4. A teacher’s note: start the line with Note:
5. Homework tasks go under ## Homework
6. Words for the lesson go under ## New words, one per line (translation and example are optional)`;
const RULES_RU=`Как подготовить файл для импорта

1. Каждую секцию начинайте с ## и названия:
## Lead-in
2. Каждое задание начинайте с ### и формулировки:
### Fill in the gaps.
3. Ответы пишите прямо в тексте:
• пропуск: She [has lived](live) here. — (live) серая подсказка
• несколько верных: [don't / do not]
• варианты: It’s fine to [make* / do / take] mistakes — * или жирный = верный
• истина/ложь: утверждение — T, F или NS
• пары: слово — значение
• колонки: Positive: proud, happy
• тест: вопрос, ниже варианты, верные жирным или со *; пустая строка между вопросами
• перевод: русское предложение → английский ответ
4. Заметка для учителя: строка начинается с Note:
5. Задания для домашки — под ## Homework
6. Слова к уроку — под ## New words, по одному на строку (перевод и пример по желанию)`;

function htmlToMarked(html){const d=document.createElement("div");d.innerHTML=html;
  d.querySelectorAll("b,strong").forEach(n=>n.replaceWith(document.createTextNode("**"+n.textContent+"**")));
  d.querySelectorAll("span").forEach(n=>{if(/font-weight:\s*(bold|[6-9]00)/.test(n.getAttribute("style")||""))n.replaceWith(document.createTextNode("**"+n.textContent+"**"))});
  d.querySelectorAll("h1,h2").forEach(n=>n.before(document.createTextNode("\n## ")));d.querySelectorAll("h3,h4").forEach(n=>n.before(document.createTextNode("\n### ")));
  d.querySelectorAll("p,div,li,h1,h2,h3,h4,tr,br").forEach(n=>n.after(document.createTextNode("\n")));
  return d.textContent.replace(/\*\*\s*\*\*/g,"").replace(/\n{3,}/g,"\n\n").trim()}
function pdfToText(f){return new Promise((res,rej)=>{if(!window.pdfjsLib){rej(new Error("nopdf"));return}try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch(e){}
  f.arrayBuffer().then(ab=>pdfjsLib.getDocument({data:ab}).promise).then(async doc=>{let out=[];for(let i=1;i<=Math.min(doc.numPages,40);i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();let line="",lastY=null;const L=[];tc.items.forEach(it=>{const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>3){L.push(line);line=""}line+=(line&&!/\s$/.test(line)?" ":"")+it.str;lastY=y});if(line)L.push(line);out.push(L.join("\n"))}res(out.join("\n\n"))}).catch(rej)})}

function detectType(txt){const L=lines(txt);if(!L.length)return null;
  if(L.every(l=>/\s—\s(T|F|NS)$/.test(l)))return "tf";if(L.some(l=>/\[[^\]]*\*[^\]]*\]/.test(l)))return "dropdown";if(L.some(l=>/\[[^\]]*\|[^\]]*\]/.test(l)))return "errors";if(L.some(l=>/\[[^\]]*\]/.test(l)))return "gap";
  if(L.every(l=>l.includes("→")))return "translate";if(L.every(l=>/\s—\s/.test(l)))return "pairs";if(L.every(l=>l.includes(":")))return "columns";if(L.every(l=>l.endsWith("?")))return "speak";return "text"}
function localImport(src){
  const res={sections:[],words:[]};let sec=null,task=null;
  const flush=()=>{if(task&&task.content.trim()){const ty=detectType(task.content)||"text";sec.tasks.push({type:ty,title:task.title||TYPES[ty].en,content:ty==="text"?`<p>${esc(task.content)}</p>`:task.content.replace(/\*\*(.+?)\*\*/g,"$1*"),unsure:true,note:"Read without AI. Check the type and the answers.",on:true})}task=null};
  src.split("\n").forEach(raw=>{const l=raw.trim();
    if(l.startsWith("## ")){flush();sec={title:l.slice(3).trim(),tasks:[]};res.sections.push(sec);return}
    if(!sec){sec={title:"Imported",tasks:[]};res.sections.push(sec)}
    if(/^new words$/i.test(sec.title)){if(l){const [w,t,ex]=l.split(/\s+—\s+/);res.words.push({w,t:t||"",ex:ex||""})}return}
    if(l.startsWith("### ")){flush();task={title:l.slice(4).trim(),content:""};return}
    if(/^note:/i.test(l)){flush();sec.tasks.push({type:"note",title:"Teacher’s note",content:l.replace(/^note:\s*/i,""),unsure:false,note:"",on:true});return}
    if(!task)task={title:"",content:""};task.content+=raw+"\n"});
  flush();res.sections=res.sections.filter(s=>s.tasks.length&&!/^new words$/i.test(s.title));return res;
}

const MINIDICT={dog:["собака","an animal people keep as a pet","Our dog loves long walks."],cat:["кошка","a small furry animal kept as a pet","The cat is sleeping on the sofa."],house:["дом","a building where people live","They live in a small house."],book:["книга","pages with text that you read","I’m reading a great book."],outcome:["результат","the result of something","We can’t control the outcome."],attempt:["попытка","an act of trying to do something","It was my first attempt."],pressure:["давление","a feeling that you must do something","There’s a lot of pressure at work."],progress:["прогресс","the process of getting better","You’re making real progress."],mistake:["ошибка","something done wrong","Everyone makes mistakes."],goal:["цель","something you want to achieve","My goal is to speak fluently."],job:["работа","the work a person does for money","She found a new job."],friend:["друг","a person you like and trust","He’s my best friend."],holiday:["отпуск","time off work or school","We went on holiday to Spain."],weekend:["выходные","Saturday and Sunday","What did you do at the weekend?"],"give it a go":["попробовать","to try something","Why not give it a go?"],"hold you back":["сдерживать","to stop you from doing something","Don’t let fear hold you back."],worthwhile:["стоящий","worth the time or effort","It was a worthwhile project."]};
const RUDICT=Object.fromEntries(Object.entries(MINIDICT).map(([k,v])=>[v[0],k]));
function splitWords(src){const out=[];src.split(/\n+/).forEach(l=>{l=l.replace(/^\s*(\d+[.)]|[-•*])\s*/,"").trim();if(!l)return;if(/\s[—–-]\s/.test(l)){const [w,t,ex]=l.split(/\s+[—–-]\s+/);out.push({w:w.trim(),t:(t||"").trim(),ex:(ex||"").trim()});return}l.split(/\s*[,;\/]\s*/).forEach(x=>{x=x.trim();if(x)out.push({w:x,t:"",ex:""})})});return out}
async function aiWords(src,o){o=o||{};const def=o.wmode==="def",ex=o.aiEx!==false;
  const j=await ask(`Make a vocabulary list for an English lesson from the input. The input may be single English or Russian words in any format (one per line, in one line with spaces, commas or slashes), "word — translation" lines, or a text: then pick the useful words, especially the ones in bold. Write each English word or phrase in its base form. ${def?"Give a short simple English definition for each word.":"Give a Russian translation for each word."} ${ex?"Add one short natural English example sentence with the word.":"Do not add examples."} If a Russian word is given, put its English equivalent in w. Keep translations, definitions and examples that are already given. Return ONLY JSON: {"words":[{"w":"English word or phrase","t":"${def?"definition":"Russian translation"}","ex":"${ex?"example":""}"}]}.\nInput:\n<<<\n${src}\n>>>`);
  if(j&&j.words)return {ai:true,ws:j.words.map(w=>({w:String(w.w||""),t:String(w.t||""),ex:ex?String(w.ex||""):""})).filter(w=>w.w)};
  const ws=splitWords(src).map(w=>{let k=w.w.toLowerCase();if(/[а-яё]/i.test(k)&&RUDICT[k]){const en=RUDICT[k];return{w:en,t:def?MINIDICT[en][1]:k,ex:ex?MINIDICT[en][2]:""}}const d=MINIDICT[k];return{w:w.w,t:w.t||(d?(def?d[1]:d[0]):""),ex:ex?(w.ex||(d?d[2]:"")):""}});
  return {ai:false,ws}}

       const out=j&&j.sentences?j.sentences.join("\n"):src.split(/(?<=[.!?])\s+/).slice(0,5).join("\n");S.edit.content=out;$("#e-content").value=out;syncEdit();b.disabled=false;toast(T("Sentences ready. Edit them if you like.","Предложения готовы. Поправьте, если нужно."))})()}break;
   case "wadd":{const src=$("#wsrc").value.trim();if(!src){$("#wsrc").focus();return}const raw=splitWords(src);const have=new Set((v==="edit"?(S.edit.opts.items||[]):S.words).map(w=>w.w.toLowerCase()));const seen=new Set();const ws=raw.filter(w=>{const k=w.w.toLowerCase();if(have.has(k)||seen.has(k))return false;seen.add(k);return true});if(v==="edit"){syncEdit();S.edit.opts.items=[...(S.edit.opts.items||[]),...ws];dEditor()}else{S.words.push(...ws);render()}toast(T(`${ws.length} words added`,`Добавлено слов: ${ws.length}`))}break;
   case "wformat":{const ta=$("#wsrc");const src=ta.value.trim();if(!src){ta.focus();return}b.disabled=true;const o=v==="edit"?S.edit.opts:(S.wopts||{});(async()=>{const r=await aiWords(src,o);ta.value=r.ws.map(w=>[w.w,w.t,w.ex].filter(Boolean).join(" — ")).join("\n");b.disabled=false;const st=$("#wstatus");if(st)st.textContent=r.ai?T("Done. Check the words and press Add.","Готово. Проверьте слова и нажмите «Добавить»."):T("AI isn’t connected right now: we filled in what we could. Check and press Add.","ИИ сейчас не подключён: дописали, что смогли. Проверьте и нажмите «Добавить».")})()}break;
   case "wdel":{const [tg2,i]=v.split(":");if(tg2==="edit"){S.edit.opts.items.splice(+i,1);dEditor()}else{S.words.splice(+i,1);render()}}break;
   case "dictate":{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast(T("Dictation isn’t available in this browser. Try Chrome or Safari.","Диктовка недоступна в этом браузере. Попробуйте Chrome или Safari."));return}
     if(rec){rec.stop();rec=null;$("#dictlbl").textContent=T("Dictate","Надиктовать");return}
     try{rec=new SR();rec.lang=S.lang==="ru"?"ru-RU":"en-GB";rec.continuous=true;rec.interimResults=false;rec.onresult=ev=>{const w=$("#wsrc");for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript.trim();if(t)w.value+=(w.value&&!w.value.endsWith("\n")?"\n":"")+t.split(/,\s*/).join("\n")}};
       rec.onerror=()=>{toast(T("The microphone isn’t available here.","Микрофон здесь недоступен."));rec=null};rec.onend=()=>{const l=$("#dictlbl");if(l)l.textContent=T("Dictate","Надиктовать");rec=null};rec.start();$("#dictlbl").textContent=T("Stop","Стоп");toast(T("Say the words, pause between them.","Говорите слова с паузами."))}catch(err){toast(T("The microphone isn’t available here.","Микрофон здесь недоступен."))}}break;
   case "import":dImport();setTimeout(()=>$("#impsrc")?.focus(),30);break;
   case "sampleins":$("#impsrc").value=SAMPLE_FILE;S.impSrc=SAMPLE_FILE;break;
   case "impgo":{const src=$("#impsrc").value.trim();if(!src){$("#imperr").textContent=T("Paste the text or upload a file first.","Сначала вставьте текст или загрузите файл.");return}S.impSrc=src;b.disabled=true;b.innerHTML=T("Reading your lesson… up to a minute","Читаю урок… до минуты");
     (async()=>{let res=await aiImport(src).catch(()=>null);if(!res||!res.sections.some(s=>s.tasks.length)){res=localImport(src);toast(T("AI isn’t available here, so the file was read by simple rules.","ИИ здесь недоступен, файл разобран по простым правилам."))}S.impRes=res;dImportResult()})()}break;
   case "impback":dImport();break;
   case "impadd":{let added=0;S.impRes.sections.forEach(s=>{const inc=s.tasks.filter(t=>t.on);if(!inc.length)return;const toHw=/^homework$/i.test(s.title);let sec=null;
       if(!toHw){sec=S.sections.find(x=>x.title.toLowerCase()===s.title.toLowerCase());if(!sec){sec={id:nid(),title:s.title};S.sections.push(sec)}}
       inc.forEach(t=>{const o=t.type==="drag"?{split:lines(t.content).length>8,per:suggestPer(lines(t.content).length)}:t.type==="note"?{show:false,color:"orange"}:["essay","open","record"].includes(t.type)?{check:true}:{};const task={id:nid(),sec:sec?sec.id:null,type:t.type,title:t.title||TYPES[t.type].en,content:t.content,opts:o};(toHw?S.hwTasks:S.tasks).push(task);added++})});
     S.words.push(...S.impRes.words);const first=S.sections.find(s=>S.tasks.some(t=>t.sec===s.id));if(first)S.activeSec=first.id;closeDlg();S.tab="lesson";render();toast(T(`${added} tasks and ${S.impRes.words.length} words added`,`Добавлено заданий: ${added}, слов: ${S.impRes.words.length}`))}break;
   case "start":openDlg(`<h2>${T("Start lesson","Начать урок")}</h2><label class="f">${T("Who","Кому")}<select class="field" id="who"><option>Anna Kuznetsova</option><option>Mikhail Denisov</option><option>Eva Sokolova</option><option>Group 7</option></select></label>
     <div class="s">${T("The student gets their own copy of the lesson. Your changes in it don’t affect this template.","Ученик получит свою копию урока. Правки в ней не меняют этот шаблон.")}</div>
     <div class="acts"><button class="btn secondary" data-act="assign" data-v="only">${T("Just assign","Только назначить")}</button><button class="btn primary" data-act="assign" data-v="open">${T("Open the class now","Открыть класс сейчас")}</button></div>`);break;
   case "assign":{const who=$("#who").value;closeDlg();if(v==="open"){window.open("https://claude.ai/artifact/HZZeDrfozzEPWbohcDN6Ab","_blank","noopener")}toast(v==="open"?T(`Class opened with ${who}`,`Класс открыт: ${who}`):T(`Lesson assigned to ${who}`,`Урок назначен: ${who}`))}break;
   case "close":if(rec){rec.stop();rec=null}S.edit=null;closeDlg();break;
  }
});
document.addEventListener("input",e=>{const el=e.target;
  if(el.id==="catq"){S.catQ=el.value;const pos=el.selectionStart;dCatalog();const q=$("#catq");q.focus();q.setSelectionRange(pos,pos);return}
  if(el.id==="ltitle"){S.title=el.value;return}
  if(el.dataset.wf){const [tg2,i,f]=el.dataset.wf.split(":");(tg2==="edit"?S.edit.opts.items:S.words)[+i][f]=el.value;if(tg2==="edit")refreshPrev();return}
  if(el.dataset.cap!==undefined){S.edit.opts.imgs[+el.dataset.cap].cap=el.value;refreshPrev();return}
  if(S.edit&&el.closest("#dlgbody")&&(el.id==="e-title"||el.id==="e-content"||el.id==="rich"||el.dataset.opt))syncEdit();
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.act2==="preview"){S.preview=t.checked;render();return}
  if(t.dataset.act2==="secsel"){S.activeSec=t.value;render();return}
  if(t.dataset.act2==="imgsp"){const id=t.dataset.v;const task=findTask(id);[...t.files].slice(0,8).forEach(file=>readImg(file,u=>{task.opts.imgs=task.opts.imgs||[];task.opts.imgs.push({src:u,cap:""});S.edit&&S.edit.id===id?dEditor():render()}));return}
  if(t.dataset.pv){S.pv[t.dataset.pv]=t.checked;S.edit&&S.edit.id===t.dataset.pv?refreshPrev():render();return}
  if(S.edit&&t.closest("#dlgbody")&&t.dataset.opt){syncEdit();if(t.closest(".svcb"))dEditor();return}
  if(t.dataset.imp!==undefined){const [si,ti]=t.dataset.imp.split(":").map(Number);S.impRes.sections[si].tasks[ti].on=t.checked}
  if(t.dataset.imptype!==undefined){const [si,ti]=t.dataset.imptype.split(":").map(Number);S.impRes.sections[si].tasks[ti].type=t.value;dImportResult()}
  const f=t.files&&t.files[0];if(!f)return;
  if(t.dataset.act2==="cover")readImg(f,u=>{S.cover=u;render()});
  if(t.dataset.act2==="txtword"&&!/\.docx$/i.test(f.name)){readFileText(f,txt=>{$("#rich").innerHTML=txt.split(/\n{2,}/).map(p=>"<p>"+esc(p).replace(/\n/g,"<br>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")+"</p>").join("");syncEdit();toast(T("Text loaded","Текст загружен"))});return}
  if(t.dataset.act2==="txtword"){if(!window.mammoth){toast(T("Word files can’t be read here right now.","Сейчас файл Word не читается."));return}f.arrayBuffer().then(ab=>window.mammoth.convertToHtml({arrayBuffer:ab})).then(r=>{$("#rich").innerHTML=sanitize(r.value);syncEdit();toast(T("Text loaded with its formatting.","Текст загружен с форматированием."))}).catch(()=>toast(T("Couldn’t read this file.","Не удалось прочитать файл.")))}
  if(t.dataset.act2==="txtpdf"&&t.files[0])readFileText(t.files[0],txt=>{$("#rich").innerHTML=txt.split(/\n{2,}/).map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("");syncEdit();toast(T("Text loaded from the PDF","Текст загружен из PDF"))});
  if(t.dataset.act2==="txtimg"){const st2=$("#txtstatus");st2.textContent=T("Reading the picture… up to a minute","Читаю картинку… до минуты");
    (async()=>{let html=null;try{if(sampleFn){const lim=sampleFn.limits?await sampleFn.limits():{images:true};if(lim&&lim.images){const j=await sampleFn.json("This is a photo or screenshot of a text, for example an article. Copy the text exactly as clean HTML: <h3> for headings, <p> for paragraphs, <b> for bold. No comments. Return ONLY JSON: {\"html\":\"...\"}",{images:[f],modelTier:"default"});html=j&&j.html}}}catch(e){if(e&&e.code==="not_granted")sampleFn=null}
      if(html){$("#rich").innerHTML=sanitize(String(html));syncEdit();st2.textContent=T("Done. Check the text against the picture.","Готово. Сверьте текст с картинкой.")}else st2.textContent=T("Reading pictures isn’t available in this view. In the real platform AI turns screenshots into text.","Чтение картинок здесь недоступно. В настоящей платформе ИИ переводит скриншоты в текст.")})()}
  if(t.dataset.act2==="imgs"){[...t.files].slice(0,8).forEach(file=>readImg(file,u=>{S.edit.opts.imgs.push({src:u,cap:""});dEditor()}))}
  if(t.dataset.act2==="media"){if(S.edit.type==="audio"){S.edit.opts.tracks=[...(S.edit.opts.tracks||[]),...[...t.files].map(x=>x.name)];S.edit.opts.file=S.edit.opts.tracks[0]}else S.edit.opts.file=f.name;dEditor()}
  if(t.dataset.act2==="imgmulti"){const fs=[...t.files];let left=fs.length;S.edit.opts.imgs=S.edit.opts.imgs||[];const add=new Array(fs.length);fs.forEach((f2,i)=>readImg(f2,u=>{add[i]={src:u,cap:""};if(--left===0){S.edit.opts.imgs.push(...add);dEditor()}}));return}
  if(t.dataset.act2==="vcover")readImg(f,u=>{S.edit.opts.cover=u;dEditor()});
  if(t.dataset.act2==="picimg")readImg(f,u=>{S.edit.opts.imgs=S.edit.opts.imgs||{};S.edit.opts.imgs[t.dataset.v]=u;dEditor()});
  if(t.dataset.act2==="wfile")readFileText(f,x=>{$("#wsrc").value=x});
  if(t.dataset.act2==="fillfile")readFileText(f,x=>{$("#fillsrc").value=x});
  if(t.dataset.act2==="impfile"){$("#impfile").textContent=f.name;readFileText(f,x=>{$("#impsrc").value=x;S.impSrc=x})}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("ai-")){e.preventDefault();e.target.nextElementSibling.click()}});
document.addEventListener("paste",e=>{const t=e.target;if(!["impsrc","fillsrc","wsrc"].includes(t.id))return;const html=e.clipboardData&&e.clipboardData.getData("text/html");if(!html)return;e.preventDefault();const txt=htmlToMarked(html);const s=t.selectionStart,en=t.selectionEnd;t.value=t.value.slice(0,s)+txt+t.value.slice(en);t.selectionStart=t.selectionEnd=s+txt.length});
/* crossword typing: fills along the chosen word */
let cwDir={};
document.addEventListener("focusin",e=>{const el=e.target;if(!el.classList||!el.classList.contains("cwin"))return;const id=el.dataset.cw;const t=findTask(id);const cw=buildCross(lines(t.content).map(l=>l.split(/\s+—\s+/)));const x=+el.dataset.x,y=+el.dataset.y;
  const starts=cw.placed.filter(p=>p.x===x&&p.y===y);const prev=cwDir[id];{const p0=document.getElementById("cwdir");if(p0&&starts.length<2)p0.hidden=true}if(starts.length===1)cwDir[id]=starts[0].d;else if(starts.length>1){cwDir[id]=prev===undefined?0:prev;let pp=document.getElementById("cwdir");if(!pp){pp=document.createElement("div");pp.id="cwdir";pp.className="cwdir";pp.innerHTML=`<button data-d="0" title="${T("Across","По горизонтали")}">→</button><button data-d="1" title="${T("Down","По вертикали")}">↓</button>`;pp.addEventListener("mousedown",ev=>{ev.preventDefault();const b=ev.target.closest("[data-d]");if(!b)return;cwDir[pp.dataset.id]=+b.dataset.d;pp.hidden=true;const cur=document.querySelector(`.cwin[data-cw="${pp.dataset.id}"][data-x="${pp.dataset.x}"][data-y="${pp.dataset.y}"]`);cwMark(pp.dataset.id,+pp.dataset.x,+pp.dataset.y);cur&&cur.focus()})}const host=el.closest("dialog")||document.body;if(pp.parentNode!==host)host.appendChild(pp);const r=el.getBoundingClientRect();pp.style.left=(r.right+4)+"px";pp.style.top=(r.top-4)+"px";pp.dataset.id=id;pp.dataset.x=x;pp.dataset.y=y;pp.hidden=false}else if(prev===undefined){const on=cw.placed.find(p=>p.d?(p.x===x&&y>=p.y&&y<p.y+p.w.length):(p.y===y&&x>=p.x&&x<p.x+p.w.length));cwDir[id]=on?on.d:0}
  document.querySelectorAll(`.cwin[data-cw="${id}"]`).forEach(c=>c.parentElement.classList.toggle("dir",false));el.parentElement.classList.add("dir");cwMark(id,x,y)});
function cwMark(id,x,y){const t=findTask(id);if(!t)return;const cw=buildCross(lines(t.content).map(l=>l.split(/\s+—\s+/)));const d=cwDir[id]||0;const w=cw.placed.find(p=>p.d===d&&(d?(p.x===x&&y>=p.y&&y<p.y+p.w.length):(p.y===y&&x>=p.x&&x<p.x+p.w.length)));document.querySelectorAll(`.cwin[data-cw="${id}"]`).forEach(c=>{const cx=+c.dataset.x,cy=+c.dataset.y;c.parentElement.classList.toggle("inword",!!w&&(w.d?(cx===w.x&&cy>=w.y&&cy<w.y+w.w.length):(cy===w.y&&cx>=w.x&&cx<w.x+w.w.length)))})}
document.addEventListener("input",e=>{const el=e.target;if(!el.classList||!el.classList.contains("cwin"))return;const id=el.dataset.cw;el.value=el.value.toUpperCase().slice(-1);S.cw[id]=S.cw[id]||{l:{}};S.cw[id].l[el.dataset.x+","+el.dataset.y]=el.value;
  if(!el.value)return;const d=cwDir[id]||0;const nx=+el.dataset.x+(d?0:1),ny=+el.dataset.y+(d?1:0);const nxt=document.querySelector(`.cwin[data-cw="${id}"][data-x="${nx}"][data-y="${ny}"]`);if(nxt){nxt.focus();nxt.select()}});
document.addEventListener("keydown",e=>{const el=e.target;if(!el.classList||!el.classList.contains("cwin")||e.key!=="Backspace"||el.value)return;const id=el.dataset.cw,d=cwDir[id]||0;const px=+el.dataset.x-(d?0:1),py=+el.dataset.y-(d?1:0);const p=document.querySelector(`.cwin[data-cw="${id}"][data-x="${px}"][data-y="${py}"]`);if(p){e.preventDefault();p.focus();p.value="";S.cw[id].l[px+","+py]=""}});
render();
