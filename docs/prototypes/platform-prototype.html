<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VibeOn — lesson</title>
<style>
:root{
  --bg:#F2F2F7;--surface:#FFFFFF;--surface2:#F2F2F7;--fill:#E3E3E8;--seg-on:#FFFFFF;
  --text:#1C1C1E;--text2:#6C6C70;--text3:#8E8E93;--sep:#E5E5EA;
  --accent:#007AFF;--accent-bg:#E5F0FF;--accent-text:#0057B8;--on-accent:#FFFFFF;
  --ok:#34C759;--ok-bg:#E8F8EC;--ok-text:#1E7B34;
  --bad:#FF3B30;--bad-bg:#FDECEB;--bad-text:#C4161C;
  --warn:#FF9500;--warn-bg:#FFF4E0;--warn-text:#8A5300;
  --grey:#C7C7CC;--grey-bg:#F2F2F7;--grey-text:#6C6C70;
  --violet:#5856D6;--violet-bg:#EEEDFF;
  --bar:rgba(242,242,247,.86);--shade:rgba(120,120,128,.08);--switch:#34C759;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#1C1C1E;--surface2:#2C2C2E;--fill:#2C2C2E;--seg-on:#636366;
    --text:#F2F2F7;--text2:#AEAEB2;--text3:#8E8E93;--sep:#38383A;
    --accent:#0A84FF;--accent-bg:#0B2B50;--accent-text:#7DB8FF;--on-accent:#FFFFFF;
    --ok:#30D158;--ok-bg:#0F2E18;--ok-text:#5BE38A;
    --bad:#FF453A;--bad-bg:#3B1514;--bad-text:#FF8A82;
    --warn:#FF9F0A;--warn-bg:#3A2A0C;--warn-text:#FFC266;
    --grey:#636366;--grey-bg:#2C2C2E;--grey-text:#AEAEB2;
    --violet:#8E8CFF;--violet-bg:#25244A;
    --bar:rgba(0,0,0,.82);--shade:rgba(255,255,255,.04);--switch:#30D158;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1C1C1E;--surface2:#2C2C2E;--fill:#2C2C2E;--seg-on:#636366;
  --text:#F2F2F7;--text2:#AEAEB2;--text3:#8E8E93;--sep:#38383A;
  --accent:#0A84FF;--accent-bg:#0B2B50;--accent-text:#7DB8FF;--on-accent:#FFFFFF;
  --ok:#30D158;--ok-bg:#0F2E18;--ok-text:#5BE38A;
  --bad:#FF453A;--bad-bg:#3B1514;--bad-text:#FF8A82;
  --warn:#FF9F0A;--warn-bg:#3A2A0C;--warn-text:#FFC266;
  --grey:#636366;--grey-bg:#2C2C2E;--grey-text:#AEAEB2;
  --violet:#8E8CFF;--violet-bg:#25244A;
  --bar:rgba(0,0,0,.82);--shade:rgba(255,255,255,.04);--switch:#30D158;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
.nav{background:var(--bg);border-right:.5px solid var(--sep);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-weight:600;font-size:15px;padding:0 10px 16px}
.navb{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-size:15px;text-align:left;min-height:40px}
.navb:hover{background:var(--fill)}
.navb[aria-current="page"]{background:var(--accent-bg);color:var(--accent);font-weight:600}
.navb .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 7px}
.navfoot{margin-top:auto;font-size:12px;color:var(--text3);padding:0 10px;line-height:1.4}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:.5px solid var(--sep);z-index:5;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .brand,.navfoot{display:none}
  .navb{width:auto;white-space:nowrap}
}
.main{padding:28px 32px 64px;min-width:0}
@media (max-width:820px){.main{padding:20px 16px 48px}}
.page{max-width:980px;margin:0 auto}
.kicker{font-size:13px;color:var(--text3)}
h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0}
h3{font-size:13px;font-weight:600;color:var(--text2);margin:0 0 10px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:22px}
.head .grow{flex:1}
.sec{margin-top:28px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:.5px solid var(--sep);min-height:60px}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--text2)}
.linkish{border:0;background:none;padding:0;font-weight:600;text-align:left;color:var(--text)}
.linkish:hover{color:var(--accent)}
.time{min-width:96px;font-variant-numeric:tabular-nums}
.time b{display:block;font-weight:600}
.time span{font-size:12px;color:var(--text3)}
.row.soon{box-shadow:inset 3px 0 0 var(--accent)}
.soonlabel{color:var(--accent);font-weight:600}

.btn{border:0;border-radius:20px;min-height:40px;padding:0 18px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.secondary{background:var(--fill);color:var(--text)}
.btn.plain{background:transparent;color:var(--accent);padding:0 8px}
.btn.small{min-height:32px;padding:0 12px;font-size:13px;border-radius:16px}
.btn.danger{background:transparent;color:var(--bad-text)}
.iconb{border:0;background:var(--fill);width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok-text)}
.p-review{background:var(--accent);color:var(--on-accent)}
.p-up{background:var(--accent-bg);color:var(--accent-text)}
.p-bad{background:var(--bad-bg);color:var(--bad-text)}
.p-warn{background:var(--warn-bg);color:var(--warn-text)}
.p-grey{background:var(--grey-bg);color:var(--grey-text)}
.p-violet{background:var(--violet-bg);color:var(--violet)}

.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;font-size:13px;padding:0 14px;min-height:30px;border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--seg-on);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.banner{display:flex;align-items:center;gap:10px;background:var(--violet-bg);color:var(--violet);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:18px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border:0;background:var(--surface);border-radius:12px;padding:10px 6px;text-align:center;min-height:64px}
.day .d{font-size:12px;color:var(--text3)}
.day .n{font-size:14px;font-weight:600;margin-top:2px}
.day.today .d{color:var(--accent);font-weight:600}
.day[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.day[aria-pressed="true"] .d{color:var(--on-accent)}
@media (max-width:560px){.day .n{font-size:12px}}
.empty{padding:22px 18px;text-align:center;color:var(--text2);font-size:14px}

/* schedule */
.calwrap{background:var(--surface);border-radius:14px;padding:12px 12px 14px;overflow-x:auto}
.cal{display:grid;grid-template-columns:44px repeat(7,minmax(96px,1fr));min-width:740px}
.calh{text-align:center;font-size:13px;padding:2px 0 10px;color:var(--text2)}
.calh.today span{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:3px 10px;font-weight:600}
.hours{position:relative}
.hours span{position:absolute;right:8px;font-size:11px;color:var(--text3);transform:translateY(-50%)}
.col{position:relative;border-left:.5px solid var(--sep);background-image:repeating-linear-gradient(to bottom,var(--sep) 0,var(--sep) .5px,transparent .5px,transparent 44px);cursor:copy}
.past{position:absolute;left:0;right:0;top:0;background:var(--shade);pointer-events:none}
.ev{position:absolute;left:3px;right:3px;border:0;border-radius:7px;padding:4px 6px 4px 8px;text-align:left;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.ev b{font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{font-size:11px;opacity:.8}
.ev .dot{width:7px;height:7px;border-radius:50%;flex:none}
.ev.upcoming,.ev.live{background:var(--accent-bg);color:var(--accent-text);box-shadow:inset 3px 0 0 var(--accent)}
.ev.done{background:var(--ok-bg);color:var(--ok-text);box-shadow:inset 3px 0 0 var(--ok)}
.ev.cancelled{background:var(--warn-bg);color:var(--warn-text);box-shadow:inset 3px 0 0 var(--warn)}
.ev.cancelled b span.nm{text-decoration:line-through}
.ev.missed{background:var(--bad-bg);color:var(--bad-text);box-shadow:inset 3px 0 0 var(--bad)}
.nowline{position:absolute;left:44px;right:0;height:1.5px;background:var(--bad);pointer-events:none;z-index:2}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* students */
.av{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.av.lg{width:64px;height:64px;font-size:24px}
.packmini{text-align:right;min-width:150px}
.packmini .s{font-size:12px}
.bar{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:5px}
.bar div{height:5px;border-radius:3px;background:var(--accent)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:10px;padding:0 12px;min-height:38px;min-width:220px;color:var(--text3)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;color:var(--text)}
.profile{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:20px}
.profile .grow{flex:1;min-width:200px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:14px}
.kv dt{color:var(--text2)}
.kv dd{margin:0;word-break:break-word}
.notes{width:100%;min-height:90px;resize:vertical;border:0;border-radius:10px;background:var(--warn-bg);color:var(--text);padding:10px 12px;font-size:14px;line-height:1.5}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border-radius:14px;padding:14px 16px}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.tile .l{font-size:13px;color:var(--text2)}
.skill{display:grid;grid-template-columns:90px minmax(0,1fr) 80px;gap:12px;align-items:center;font-size:14px;padding:6px 0}
.skill .track{position:relative;height:8px;border-radius:4px;background:var(--fill)}
.skill .fillb{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.skill .target{position:absolute;top:-4px;width:2px;height:16px;background:var(--text);border-radius:1px}
.skill .val{text-align:right;color:var(--text2);font-variant-numeric:tabular-nums}

/* review & courses */
.answer{background:var(--surface2);border-radius:10px;padding:10px 12px;margin:6px 0 8px;font-size:15px}
.essay{background:var(--surface2);border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.65;margin:8px 0}
.field{width:100%;border:0;background:var(--surface2);border-radius:10px;padding:8px 12px;min-height:40px;font-size:15px}
textarea.field{min-height:110px;resize:vertical;line-height:1.5}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ctile{border:0;background:var(--surface);border-radius:16px;padding:0;text-align:left;overflow:hidden;min-height:150px;display:flex;flex-direction:column}
.ctile .cov{height:62px}
.ctile .body{padding:12px 14px}
.ctile .t{font-weight:600;font-size:16px}
.ctile .s{font-size:13px;color:var(--text2)}
.ctile.new{border:1.5px dashed var(--grey);background:transparent;align-items:center;justify-content:center;color:var(--accent);font-weight:600;gap:8px}
.ctile.new .plus{width:44px;height:44px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center}
.unit{margin-top:18px}

/* dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(440px,calc(100vw - 32px));background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:20px 22px 18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 60px);overflow-y:auto}
.dlg label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--text2)}
.dlg .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{border:0;background:var(--fill);border-radius:999px;padding:0 14px;min-height:34px;font-size:14px}
.chipsel button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:13px;background:var(--fill);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--switch)}
.switch:checked::after{transform:translateX(18px)}
.err{color:var(--bad-text);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}

.navsep{height:.5px;background:var(--sep);margin:12px 10px}
@media (max-width:820px){.navsep{width:.5px;height:24px;margin:8px 4px;flex:none}}
.thead,.trow{display:grid;grid-template-columns:96px minmax(0,1fr) 180px 140px;gap:14px;align-items:center;padding:0 16px}
.thead{font-size:12px;color:var(--text3);padding-top:10px;padding-bottom:6px;border-bottom:.5px solid var(--sep)}
.trow{min-height:64px;border-bottom:.5px solid var(--sep);padding-top:10px;padding-bottom:10px}
.trow:last-child{border-bottom:0}
.trow.soon{box-shadow:inset 3px 0 0 var(--accent)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who .linkish{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hwcell{display:flex}
.hwbtn{border:0;min-height:28px;cursor:pointer}
.hwbtn:hover{filter:brightness(.95)}
.acts2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:760px){.thead{display:none}.trow{grid-template-columns:70px minmax(0,1fr);row-gap:8px}.hwcell{grid-column:2}.acts2{grid-column:1 / -1;justify-content:flex-start}}
.thead2{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);padding:10px 16px 6px;border-bottom:.5px solid var(--sep)}
.earn{text-align:center;font-size:13px;font-weight:600;padding:10px 2px 4px;border-top:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.earn.zero{color:var(--text3);font-weight:400}
.earn.lbl{font-size:11px;color:var(--text3);font-weight:400;text-align:left;padding-left:0}
.nowline{right:0}
.note2{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.tblwrap{background:var(--surface);border-radius:14px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
.tbl th{font-size:12px;font-weight:600;color:var(--text3);text-align:left;padding:12px 14px 8px;border-bottom:.5px solid var(--sep);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:.5px solid var(--sep);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctiles{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ctile{flex-direction:row;align-items:center;gap:14px;padding:14px;min-height:0}
.ctile .body{padding:0;flex:1;min-width:0}
.ctile.new{flex-direction:column;min-height:126px}
.cover{flex:none;width:72px;height:96px;border-radius:6px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cover.lg{width:96px;height:128px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.checks{display:flex;flex-direction:column;gap:2px;max-height:190px;overflow-y:auto;background:var(--surface2);border-radius:10px;padding:8px 12px}
.checks label{display:flex;align-items:center;gap:10px;font-size:15px;padding:5px 0;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--accent)}

.plabel{font-size:11px;color:var(--text3);margin-bottom:3px}
.qprev{font-size:14px;margin-top:4px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px}
.qsent{font-size:17px;line-height:1.9}
.bub2{background:var(--surface2);border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.5;max-width:560px}
.bub2.me{background:var(--accent-bg);color:var(--text)}

.thead span:nth-child(3){padding-left:2px}
.acts2 .btn{width:100%}
.paylink{border:0;background:none;padding:0;font-size:12px;font-weight:600;color:var(--accent);text-align:right;cursor:pointer}
.paylink:hover{text-decoration:underline}
.paylink.bad{color:var(--bad-text)}

.onbwrap{display:none}
.onboarding .shell{display:none}

/* ---------- task engine ---------- */
const lines=m=>m.split("\n").map(s=>s.trim()).filter(Boolean);
function parse(line,choice){const parts=[];const re=/\[([^\]]*)\]/g;let last=0,m;
  while((m=re.exec(line))){parts.push({t:"text",v:line.slice(last,m.index)});const inner=m[1].trim();
    if(choice)parts.push({t:"choice",options:inner.split("/").map(x=>{x=x.trim();const c=x.endsWith("*");return{v:c?x.slice(0,-1).trim():x,c}})});
    else parts.push({t:"gap",open:!inner,answers:inner.split("/").map(x=>x.trim()).filter(Boolean)});last=re.lastIndex}
  parts.push({t:"text",v:line.slice(last)});return parts}
const st=id=>{if(!S.ans[id]){const tt=allTasks().find(x=>x.id===id);if(tt&&tt.mode==="button")S.later[id]=true}return S.ans[id]||(S.ans[id]={vals:{},status:{},attempts:0,done:false})};

function nxAct(a,t,v){const n=nx(t.id);
 if(a==="nxp"){const P=NXD.pairs;const side=v[0],i=+v.slice(1);if(i<0)return;
  if(side==="L"){n.sel=i;render();return}
  if(n.sel===undefined){return}
  if(t.mode==="button"){Object.keys(n.links).forEach(k=>{if(n.links[k]===i)delete n.links[k]});n.links[n.sel]=i;n.sel=undefined;n.res=null;render();return}
  if(n.sel===i){n.ok[i]=true;n.sel=undefined}else{n.flash="R"+i;setTimeout(()=>{n.flash=null;render()},600)}render();return}
 if(a==="nxe"){if(n.st[v]==="good")return;n.pick[v]=!n.pick[v];if(n.stage==="fix"){const [i,k]=v.split("-").map(Number);const w=NXD.errors[i][0].split(" ")[k].replace(/[.,]/g,"");n.st[v]=w===NXD.errors[i][1][0]?"good":"bad"}render();return}
 if(a==="nxt"){const [i,j]=v.split("-").map(Number);n.a[i]=j;n.checked=false;render();return}
 if(a==="nxcheck"){
  if(t.type==="pairs"){n.res={};NXD.pairs.forEach((_,i)=>{if(n.ok[i])return;if(n.links[i]===undefined)return;n.res[i]=n.links[i]===i;if(n.res[i]){n.ok[i]=true;delete n.links[i];delete n.res[i]}});render();return}
  if(t.type==="errors"){Object.keys(n.pick).forEach(key=>{if(!n.pick[key])return;const [i,k]=key.split("-").map(Number);const w=NXD.errors[i][0].split(" ")[k].replace(/[.,]/g,"");n.st[key]=w===NXD.errors[i][1][0]?"good":"bad"});n.stage="fix";n.fixres={};NXD.errors.forEach(([s,[w,fix]],i)=>{if((n.fix||{})[i]!==undefined)n.fixres[i]=nxNorm(n.fix[i])===nxNorm(fix)?"ok":"no"});render();return}
  if(t.type==="dictation"){NXD.dict.forEach((s,i)=>{const a2=nxNorm(n.v[i]||""),b2=nxNorm(s);if(!a2)return;const d=lev(a2,b2);n.r[i]={c:d===0?"good":d/b2.length<=.2?"near":"bad"}});render();return}
  if(t.type==="order"){n.res=true;render();return}
  if(t.type==="test"){n.checked=true;render();return}}
 if(a==="nxretry"){if(t.type==="pairs"){Object.keys(n.res||{}).forEach(i=>{if(!n.res[i])delete n.links[i]});n.res=null}if(t.type==="test"){NXD.test.forEach(([q,opts],i)=>{const j=n.a[i];if(j!==undefined&&!opts[j].endsWith("*"))delete n.a[i]});n.checked=false}render();return}
 if(a==="nxscr"){n.open=!n.open;render();return}
 if(a==="nxshow"){n.shown=!n.shown;n.open=n.shown;render();return}
 if(a==="nxrec2"){if(n.rec){n.rec=false;n.has=true}else n.rec=true;render();return}
 if(a==="nxtr"){n.tr=true;render();return}
 if(a==="nxok2"){n.ok=true;render();toast(T("The student sees the corrected version","Ученик видит исправленную версию"));return}
 if(a==="nxsend"){const inp=document.getElementById("aiin-"+t.id);const x=inp&&inp.value.trim();if(!x)return;n.log.push({w:"me",x});const turn=NXD.ai[n.k];if(turn){n.log.push({w:"ai",x:turn[0]});sayIt(turn[0]);n.k++}render();return}
 if(a==="nxok"){const ed=document.getElementById("es-"+t.id);if(ed)n.corr=ed.innerHTML;n.ok=true;render();toast(T("The student now sees the corrections","Ученик видит исправления"));return}
 if(a==="nxrec"){if(!n.rec){n.rec=true;render();return}n.rec=false;const turn=NXD.ai[n.k];if(n.k>0||n.log.length)n.log.push({w:"me",x:NXD.ai[n.k-1]?NXD.ai[n.k-1][1]:turn[1]});if(!n.log.length||n.log[n.log.length-1].w==="me"){n.log.push({w:"ai",x:turn[0]});sayIt(turn[0]);n.k++}render();return}
}

function check(t){
  const s=st(t.id);let wrong=0;
  lines(t.markup).forEach((l,li)=>parse(l,t.type==="choice").forEach((p,gi)=>{if(p.t==="text")return;const k=li+"-"+gi;if(s.status[k]==="ok"||s.status[k]==="typo")return;
    if(p.t==="gap"){if(p.open)return;const v=norm(s.vals[k]);if(p.answers.some(a=>norm(a)===v))s.status[k]="ok";else if(v&&p.answers.some(a=>norm(a).length>=5&&lev(v,norm(a))<=1))s.status[k]="typo";else{s.status[k]="bad";wrong++}}
    else{const pk=s.vals[k];if(pk!==undefined&&p.options[pk].c)s.status[k]="ok";else{s.status[k]="bad";wrong++}}}));
  if(wrong){s.attempts++;if(s.attempts>=3)for(const k in s.status)if(s.status[k]==="bad")s.status[k]="revealed"}
  render();toast(wrong?(s.attempts>=3?"Out of attempts. Correct answers are shown in yellow.":`Not quite. ${3-s.attempts} ${3-s.attempts===1?"attempt":"attempts"} left.`):"All correct. Nice work!");
}

async function translate(){

  const offline=()=>{const res=DICT.filter(([e,r])=>ru?r.toLowerCase().includes(q.toLowerCase()):e.toLowerCase().startsWith(q.toLowerCase())).slice(0,6).map(([e,r])=>({en:e,ru:r,ex:""}));S.dres={dir:ru?"ru-en":"en-ru",items:res,offline:true}};
  if(sampleFn){try{const j=await sampleFn.json(`You are a bilingual English–Russian dictionary for adult learners. Translate the query below. If it is Russian, give English equivalents; if it is English, give Russian translations. Return ONLY JSON in this shape: {"direction":"en-ru" or "ru-en","results":[{"en":"English word or phrase","ru":"Russian translation(s), comma separated","example":"one short natural English example sentence using the English word"}]} with 1 to 3 results, most common meaning first.\nQuery: ${q}`,{modelTier:"quick"});
      const items=(j.results||[]).slice(0,3).map(x=>({en:String(x.en||""),ru:String(x.ru||""),ex:String(x.example||"")})).filter(x=>x.en);

function openText(p,kind){const w=$(".cvwrap");const old=$("#btext");if(old)old.remove();const i=document.createElement(kind==="sticky"?"textarea":"input");i.id="btext";i.className="btext "+(kind==="sticky"?"stk":"");i.placeholder=kind==="sticky"?T("Note… Enter to save","Заметка… Enter — сохранить"):T("Text… Enter to save","Текст… Enter — сохранить");i.style.left=p[0]+"px";i.style.top=(p[1]-14)+"px";i.dataset.x=p[0];i.dataset.y=p[1];i.dataset.kind=kind||"text";w.appendChild(i);setTimeout(()=>{i.focus();i.addEventListener("blur",()=>setTimeout(commitText,50))},30);i.addEventListener("keydown",ev=>{if(ev.key==="Escape"){i.value="";i.blur()}else if(ev.key==="Enter"&&(kind!=="sticky"||!ev.shiftKey)){ev.preventDefault();i.blur()}})}
function commitText(){const i=$("#btext");if(!i)return;const v=i.value.trim();if(v)S.bpages[S.bpage].shapes.push({type:i.dataset.kind==="sticky"?"sticky":"text",bg:i.dataset.kind==="sticky"?(S.board.stk||"#FFE58A"):undefined,color:S.board.color,size:S.board.size,x:+i.dataset.x,y:+i.dataset.y,text:v});i.remove();drawAll()}
function shp(c,s){c.save();c.strokeStyle=col(s.color);c.fillStyle=col(s.color);c.lineWidth=s.size||2;c.lineCap="round";c.lineJoin="round";
  if(s.type==="marker")c.globalAlpha=.35;if(s.type==="eraser")c.globalCompositeOperation="destination-out";
  if(["pen","marker","eraser","laser"].includes(s.type)){if(s.type==="laser"){c.strokeStyle="#FF3B30";c.lineWidth=4;c.shadowColor="#FF3B30";c.shadowBlur=12}c.beginPath();s.p.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));if(s.p.length===1)c.lineTo(s.p[0][0]+.1,s.p[0][1]);c.stroke()}
  else if(s.type==="line"||s.type==="arrow"){c.beginPath();c.moveTo(...s.a);c.lineTo(...s.b);c.stroke();if(s.type==="arrow"){const ang=Math.atan2(s.b[1]-s.a[1],s.b[0]-s.a[0]),L=12+(s.size||2)*2;c.beginPath();c.moveTo(...s.b);c.lineTo(s.b[0]-L*Math.cos(ang-0.45),s.b[1]-L*Math.sin(ang-0.45));c.moveTo(...s.b);c.lineTo(s.b[0]-L*Math.cos(ang+0.45),s.b[1]-L*Math.sin(ang+0.45));c.stroke()}}
  else if(s.type==="rect"){if(s.fill){c.save();c.globalAlpha=.22;c.fillRect(s.a[0],s.a[1],s.b[0]-s.a[0],s.b[1]-s.a[1]);c.restore()}c.strokeRect(s.a[0],s.a[1],s.b[0]-s.a[0],s.b[1]-s.a[1])}
  else if(s.type==="ellipse"){c.beginPath();c.ellipse((s.a[0]+s.b[0])/2,(s.a[1]+s.b[1])/2,Math.abs(s.b[0]-s.a[0])/2||1,Math.abs(s.b[1]-s.a[1])/2||1,0,0,Math.PI*2);if(s.fill){c.save();c.globalAlpha=.22;c.fill();c.restore()}c.stroke()}
  else if(s.type==="text"){c.font=`${14+(s.size||2)*3}px -apple-system, BlinkMacSystemFont, Arial, sans-serif`;c.textBaseline="middle";c.fillText(s.text,s.x,s.y)}
  else if(s.type==="cover"){const x=Math.min(s.a[0],s.b[0]),y=Math.min(s.a[1],s.b[1]),w=Math.abs(s.b[0]-s.a[0]),h=Math.abs(s.b[1]-s.a[1]);c.globalAlpha=teacher()?(s.al||.95):1;c.fillStyle=s.bg||"#C7C7CC";c.beginPath();c.roundRect?c.roundRect(x,y,w,h,10):c.rect(x,y,w,h);c.fill();c.globalAlpha=1;if(w>24&&h>24){c.fillStyle="#8E8E93";const fs=Math.min(34,Math.max(14,Math.min(w,h)*.45));c.font=`700 ${fs}px -apple-system, Arial, sans-serif`;c.textAlign="center";c.textBaseline="middle";c.fillText("?",x+w/2,y+h/2)}}
  else if(s.type==="table"){const x=Math.min(s.a[0],s.b[0]),y=Math.min(s.a[1],s.b[1]),w=Math.abs(s.b[0]-s.a[0]);const cw=w/s.cols;c.font="15px -apple-system, Arial, sans-serif";const wrap=(t,mw)=>{const out=[];String(t||"").split("\n").forEach(par=>{let ln="";par.split(" ").forEach(wd=>{const tt=ln?ln+" "+wd:wd;if(c.measureText(tt).width>mw&&ln){out.push(ln);ln=wd}else ln=tt});out.push(ln)});return out};
    const base=s.rh||Math.max(30,(Math.abs(s.b[1]-s.a[1]))/s.rows);if(!s.rh)s.rh=base;const hs=[];for(let ri=0;ri<s.rows;ri++){let mx=1;for(let ci=0;ci<s.cols;ci++){const tx=ri===0&&s.header?(s.labels||[])[ci]:(s.cells||{})[ri+":"+ci];if(tx)mx=Math.max(mx,wrap(tx,cw-16).length)}hs.push(Math.max(base,mx*19+12))}const H=hs.reduce((a,b)=>a+b,0);s.a=[x,y];s.b=[x+w,y+H];
    c.lineWidth=1.5;c.strokeStyle=col(s.color||"ink");if(s.header){c.globalAlpha=.08;c.fillStyle=col(s.color||"ink");c.fillRect(x,y,w,hs[0]);c.globalAlpha=1}c.strokeRect(x,y,w,H);for(let i=1;i<s.cols;i++){c.beginPath();c.moveTo(x+cw*i,y);c.lineTo(x+cw*i,y+H);c.stroke()}let yy=y;hs.forEach((hh,ri)=>{if(ri>0){c.beginPath();c.moveTo(x,yy);c.lineTo(x+w,yy);c.stroke()}for(let ci=0;ci<s.cols;ci++){const tx=ri===0&&s.header?(s.labels||[])[ci]:(s.cells||{})[ri+":"+ci];if(!tx)continue;c.fillStyle=col(s.color||"ink");c.font=(ri===0&&s.header?"600 ":"")+"15px -apple-system, Arial, sans-serif";c.textBaseline="top";wrap(tx,cw-16).forEach((ln,k)=>c.fillText(ln,x+cw*ci+8,yy+8+k*19))}yy+=hh});s._hs=hs}
  else if(s.type==="node"){const x=Math.min(s.a[0],s.b[0]),y=Math.min(s.a[1],s.b[1]),w=Math.abs(s.b[0]-s.a[0]),h=Math.abs(s.b[1]-s.a[1]);c.lineWidth=s.center?2.5:1.8;c.fillStyle=s.center?"#EAF3FF":"#FFFFFF";c.beginPath();c.roundRect?c.roundRect(x,y,w,h,12):c.rect(x,y,w,h);c.fill();c.stroke();c.fillStyle=col(s.color);c.font=`${s.center?"600 ":""}15px -apple-system, Arial, sans-serif`;c.textAlign="center";c.textBaseline="middle";c.fillText(s.text||"",x+w/2,y+h/2,w-12);c.textAlign="start"}
  else if(s.type==="mlink"){const sh=S.bpages[S.bpage].shapes;const A=sh.find(q=>q.id===s.from),Bn=sh.find(q=>q.id===s.to);if(A&&Bn){const ea=edgePt(A,Bn),eb=edgePt(Bn,A);c.lineWidth=1.8;c.beginPath();c.moveTo(...ea);c.lineTo(...eb);c.stroke()}}
  else if(s.type==="timeline"){const x=Math.min(s.a[0],s.b[0]),y=Math.min(s.a[1],s.b[1]),w=Math.abs(s.b[0]-s.a[0]),h=Math.abs(s.b[1]-s.a[1]);const my=y+h*.4;c.lineWidth=s.size||3;c.beginPath();c.moveTo(x,my);c.lineTo(x+w,my);c.stroke();c.beginPath();c.moveTo(x+w,my);c.lineTo(x+w-14,my-8);c.moveTo(x+w,my);c.lineTo(x+w-14,my+8);c.stroke();const ps=tlPos(s);const ord=ps.map((f,i)=>[f,i]).sort((a,b)=>a[0]-b[0]);ord.forEach(([f,i],k)=>{if(k%2===0&&k+1<ord.length){c.save();c.globalAlpha=.08;c.fillStyle=col(s.color);c.fillRect(x+w*f,my-8,w*(ord[k+1][0]-f),16);c.restore()}});c.font="15px -apple-system, Arial, sans-serif";c.textAlign="center";c.textBaseline="top";s.labels.forEach((l,i)=>{const px=x+w*ps[i];const selm=S.selShape===s&&S.selMark===i;c.lineWidth=selm?4:(s.size||3);c.strokeStyle=selm?"#0A84FF":col(s.color);c.beginPath();c.moveTo(px,my-11);c.lineTo(px,my+11);c.stroke();if(l&&l!=="•")c.fillText(l,px,my+16);else{c.beginPath();c.arc(px,my,5,0,7);c.fill()}});c.textAlign="start";c.strokeStyle=col(s.color)}
  else if(s.type==="sticky"){const ls=s.text.split("\n");const w=s.w||Math.max(120,Math.min(220,Math.max(...ls.map(l=>l.length))*8+20)),h=s.h||26+ls.length*20;c.fillStyle=s.bg||"#FFE58A";c.shadowColor="rgba(0,0,0,.15)";c.shadowBlur=6;c.fillRect(s.x,s.y,w,h);c.shadowBlur=0;c.fillStyle="#3A2A0C";c.font="15px -apple-system, Arial, sans-serif";c.textBaseline="top";ls.forEach((l,i)=>c.fillText(l,s.x+10,s.y+12+i*20))}
  c.restore()}
function drawAll(){setTimeout(()=>{try{drawSel()}catch(e){}},0);if(!ctx)return;const cb=$("#cvb");const pg=S.bpages[S.bpage];const W=cv.width,H=cv.height;
  if(cb){const b=cb.getContext("2d");b.clearRect(0,0,W,H);const done=()=>pg.base.forEach(s=>shp(b,s));if(pg.bg){const im=new Image();im.onload=()=>{const r=cv.getBoundingClientRect();const k=Math.min(r.width/im.width,r.height/im.height);b.drawImage(im,(r.width-im.width*k)/2,(r.height-im.height*k)/2,im.width*k,im.height*k);done()};im.src=pg.bg}else done()}
  ctx.clearRect(0,0,W,H);pg.shapes.forEach(s=>shp(ctx,s));if(S.laser)shp(ctx,S.laser)}
function tableTpl(c,rw,hd){const r0=cv.getBoundingClientRect();const W=r0.width,H=r0.height,x0=40,y0=40,x1=W-40,y1=H-30;const L=[];const g="ink";L.push({type:"rect",color:g,size:2,a:[x0,y0],b:[x1,y1]});const cw=(x1-x0)/c,rh=(y1-y0)/rw;for(let i=1;i<c;i++)L.push({type:"line",color:g,size:2,a:[x0+i*cw,y0],b:[x0+i*cw,y1]});for(let j=1;j<rw;j++)L.push({type:"line",color:g,size:hd&&j===1?3:1,a:[x0,y0+j*rh],b:[x1,y0+j*rh]});return L}
function templateObj(k){const r0=cv.getBoundingClientRect();const W=r0.width,H=r0.height,cx=W/2,cy=H/2;const L=[];
  if(k==="mind"){const g="m"+Date.now();const cid=g+"c";L.push({type:"node",id:cid,g,center:true,color:"ink",text:T("Topic","Тема"),a:[cx-90,cy-30],b:[cx+90,cy+30]});
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([dx,dy],i)=>{const x=cx+dx*Math.min(250,W*.3),y=cy+dy*Math.min(150,H*.28);const id=g+i;L.push({type:"node",id,g,color:"ink",text:T("Idea","Идея"),a:[x-70,y-24],b:[x+70,y+24]});L.push({type:"mlink",g,from:cid,to:id,color:"ink"})})}
  if(k==="tchart"){const w=Math.min(560,W-120),h=Math.min(320,H-140);L.push({type:"table",cols:2,rows:6,header:true,labels:[T("For","За"),T("Against","Против")],color:"ink",a:[cx-w/2,cy-h/2],b:[cx+w/2,cy+h/2]})}
  if(k==="timeline"){const w=Math.min(640,W-120);L.push({type:"timeline",color:"ink",size:3,labels:[T("Past","Прошлое"),T("Now","Сейчас"),T("Future","Будущее")],pos:[.2,.5,.8],a:[cx-w/2,cy-30],b:[cx+w/2,cy+40]})}
  return L}
function template(k){const r=cv.getBoundingClientRect();const W=r.width,H=r.height,cx=W/2,cy=H/2;const g="ink";const L=[];
  const el=(x,y,rx,ry)=>L.push({type:"ellipse",color:g,size:2,a:[x-rx,y-ry],b:[x+rx,y+ry]});const ln=(a,b)=>L.push({type:"line",color:g,size:2,a,b});const tx=(x,y,t)=>L.push({type:"text",color:g,size:2,x,y,text:t});
  if(k==="mind"){el(cx,cy,90,40);tx(cx-40,cy,"Topic");[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([dx,dy])=>{const x=cx+dx*W*.3,y=cy+dy*H*.28;ln([cx+dx*70,cy+dy*25],[x-dx*60,y-dy*20]);el(x,y,70,30)})}
  if(k==="tchart"){ln([cx,40],[cx,H-30]);ln([40,80],[W-40,80]);tx(cx-W/4-30,55,"For");tx(cx+W/4-40,55,"Against")}
  const rc=(x1,y1,x2,y2)=>L.push({type:"rect",color:g,size:2,a:[x1,y1],b:[x2,y2]});
  if(k==="words"){const xs=[40,W*.33,W*.62,W-40];rc(40,50,W-40,H-30);ln([xs[1],50],[xs[1],H-30]);ln([xs[2],50],[xs[2],H-30]);ln([40,95],[W-40,95]);tx(55,78,"Word");tx(xs[1]+15,78,"Meaning");tx(xs[2]+15,78,"Example");for(let y=95+55;y<H-30;y+=55)ln([40,y],[W-40,y])}
  if(k==="story"){const w=(W-120)/3;["Beginning","Middle","End"].forEach((n,i)=>{const x=40+i*(w+20);rc(x,70,x+w,H-40);tx(x+14,98,n);if(i<2)L.push({type:"arrow",color:g,size:2,a:[x+w+2,cy],b:[x+w+18,cy]})})}
  if(k==="dialogue"){rc(40,60,W*.62,60+H*.22);tx(55,90,"A:");rc(W*.38,90+H*.22,W-40,90+H*.44);tx(W*.38+15,120+H*.22,"B:");rc(40,120+H*.44,W*.62,120+H*.66);tx(55,150+H*.44,"A:")}
  if(k==="comic"){const w=(W-100)/2,h=(H-90)/2;[[0,0],[1,0],[0,1],[1,1]].forEach(([i,j],n)=>{const x=40+i*(w+20),y=40+j*(h+10);rc(x,y,x+w,y+h);tx(x+10,y+24,String(n+1))})}
  if(k==="timeline"){L.push({type:"arrow",color:g,size:3,a:[50,cy],b:[W-40,cy]});[[.2,"Past"],[.5,"Now"],[.8,"Future"]].forEach(([f,t])=>{ln([W*f,cy-12],[W*f,cy+12]);tx(W*f-22,cy+34,t)})}
  return L}
window.addEventListener("resize",()=>{if(S.tab==="board"&&cv){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);drawAll()}});
try{if(location.hash==="#homework")S.tab="homework"}catch(e){}
render();
