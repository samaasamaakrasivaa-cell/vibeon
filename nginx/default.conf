# Nginx перед приложением. На этапе 11 (Запуск) сюда добавится блок HTTPS
# с сертификатом Let's Encrypt для вашего домена.
upstream vibeon_app { server app:3000; }

server {
  listen 80;
  server_name _;
  client_max_body_size 50m;   # загрузка фото, аудио, PDF

  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location / {
    proxy_pass http://vibeon_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket для урока в реальном времени (этап 5)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
}
