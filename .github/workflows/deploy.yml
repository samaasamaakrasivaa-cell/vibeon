name: Server

# Действия на сервере через SSH-ключ из секретов репозитория (SSH_HOST, SSH_KEY).
# Код передаётся на сервер прямо отсюда (работает и для приватного репозитория).
# Ключи сервисов берутся из секретов репозитория (action: secrets) — в журнал не попадают.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать"
        type: choice
        options: [check, install, update, status, logs, backup, verify, secrets, proxy, dns, testmail, errors]
        default: check
      arg:
        description: "Параметр: домен для proxy/install, почта для verify"
        required: false
        default: ""

concurrency: { group: server, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env: { SSH_KEY: "${{ secrets.SSH_KEY }}", SSH_HOST: "${{ secrets.SSH_HOST }}" }
        run: |
          [ -n "$SSH_KEY" ] && [ -n "$SSH_HOST" ] || { echo "Нет секретов SSH_KEY / SSH_HOST в репозитории"; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -T 15 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host srv\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/id\n  ServerAliveInterval 30\n' "$SSH_HOST" > ~/.ssh/config
          ssh srv true && echo "SSH: ok"

      # Сборка здесь, а не на сервере: там мало памяти и работают другие проекты
      - name: Build image and send to server
        if: inputs.action == 'install' || inputs.action == 'update'
        run: |
          docker build -t vibeon-app:latest .
          docker save vibeon-app:latest | gzip | ssh srv 'old=$(docker image inspect -f "{{.Id}}" vibeon-app:latest 2>/dev/null || true); gunzip | docker load; echo "$old" > /tmp/vibeon-old-image'

      - name: Run on server
        env:
          ACTION: ${{ inputs.action }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          ARG: ${{ inputs.arg }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YANDEX_CLOUD_FOLDER_ID: ${{ secrets.YANDEX_CLOUD_FOLDER_ID }}
          YANDEX_CLOUD_API_KEY: ${{ secrets.YANDEX_CLOUD_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          LEGAL_OPERATOR: ${{ secrets.LEGAL_OPERATOR }}
          LEGAL_INN: ${{ secrets.LEGAL_INN }}
          LEGAL_EMAIL: ${{ secrets.LEGAL_EMAIL }}
        run: |
          set -eo pipefail
          Q=$(printf '%q' "$ARG")
          V=bash\ /opt/vibeon/deploy/vibeon.sh
          sync() { # код из этого коммита → /opt/vibeon (deploy/.env и бэкапы на сервере не трогаются)
            tar czf - --exclude=.git --exclude=node_modules --exclude=.next . | ssh srv "mkdir -p /opt/vibeon && tar xzf - -C /opt/vibeon && echo '${GITHUB_SHA::7}' > /opt/vibeon/REVISION"
          }
          case "$ACTION" in
            check)   ssh srv "bash -s" < deploy/check.sh ;;
            install) sync; ssh srv "NO_BUILD=1 $V install $Q" ;;
            update)  sync; ssh srv "NO_BUILD=1 $V update" ;;
            status)  ssh srv "$V status; echo; echo версия: \$(cat /opt/vibeon/REVISION 2>/dev/null)"
                     url=$(ssh srv "grep -E '^APP_URL=' /opt/vibeon/deploy/.env | cut -d= -f2-")
                     echo "Снаружи ($url):"; curl -sS -m 15 "$url/api/health" || echo "недоступно снаружи" ;;
            logs)    ssh srv "docker compose -f /opt/vibeon/deploy/docker-compose.prod.yml --env-file /opt/vibeon/deploy/.env logs --tail 200 --no-color" ;;
            backup)  ssh srv "$V backup" ;;
            verify)  ssh srv "$V verify $Q" ;;
            testmail) docker_cp() { cat deploy/testmail.js | ssh srv "docker exec -i vibeon-app-1 sh -c 'cat > /tmp/testmail.js'"; }; docker_cp
                     ssh srv "docker exec -e HOME=/tmp -e npm_config_cache=/tmp/.npm vibeon-app-1 sh -c 'mkdir -p /tmp/tm && cd /tmp/tm && npm i --no-save --no-audit --no-fund --loglevel=error nodemailer@6 2>&1 | tail -5'; docker exec -e NODE_PATH=/tmp/tm/node_modules vibeon-app-1 node /tmp/testmail.js $Q" ;;
            errors)  ssh srv "docker logs vibeon-app-1 --since \${ARG:-60m} 2>&1 | grep -iE -B2 -A8 'error|exception|digest' | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]+/[email]/g' | tail -80" ;;
            dns)     d="${ARG:-vibeon.online}"
                     for q in "A $d" "A www.$d" "TXT $d" "TXT gokey._domainkey.$d" "CNAME _dmarc.$d" "CNAME email.$d" "CNAME dkey._domainkey.email.$d" "MX $d"; do
                       set -- $q; echo "$1 $2: $(dig +short "$1" "$2" @8.8.8.8 | tr '\n' ' ' | cut -c1-160)"; done ;;
            proxy)   sync; ssh srv "bash /opt/vibeon/deploy/attach-proxy.sh $Q" ;;
            secrets)
              n=0
              for k in TELEGRAM_BOT_TOKEN YANDEX_CLOUD_FOLDER_ID YANDEX_CLOUD_API_KEY SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM LEGAL_OPERATOR LEGAL_INN LEGAL_EMAIL; do
                v="${!k}"; [ -n "$v" ] || continue
                printf '%s' "$v" | ssh srv "v=\$(cat); $V setq $k=\"\$v\"" && echo "записано: $k" && n=$((n+1))
              done
              if [ -n "$YANDEX_CLOUD_API_KEY" ]; then ssh srv "$V setq AI_PROVIDER=yandex" && echo "записано: AI_PROVIDER=yandex"; fi
              [ "$n" -gt 0 ] && ssh srv "$V restart" || echo "Секретов для записи нет" ;;
          esac
          # старый образ VibeOn — удалить (только свой, чужие не трогаем)
          if [ "$ACTION" = install ] || [ "$ACTION" = update ]; then
            ssh srv 'o=$(cat /tmp/vibeon-old-image 2>/dev/null); n=$(docker image inspect -f "{{.Id}}" vibeon-app:latest); [ -n "$o" ] && [ "$o" != "$n" ] && docker rmi "$o" >/dev/null 2>&1; rm -f /tmp/vibeon-old-image; true'
          fi
