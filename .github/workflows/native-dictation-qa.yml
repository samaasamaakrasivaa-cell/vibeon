name: Isolated native dictation QA
on:
  push:
    branches: [codex/ai-quality/dictation-native-qa]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare synthetic audio and browser tools
        run: |
          npm ci
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright-core
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          google-chrome --version
          python -m pip install --quiet piper-tts
          for model in en/en_US/lessac/medium/en_US-lessac-medium ru/ru_RU/irina/medium/ru_RU-irina-medium; do
            name="${model##*/}"
            curl -fsSL --retry 2 "https://huggingface.co/rhasspy/piper-voices/resolve/main/$model.onnx?download=true" -o "$RUNNER_TEMP/$name.onnx"
            curl -fsSL --retry 2 "https://huggingface.co/rhasspy/piper-voices/resolve/main/$model.onnx.json?download=true" -o "$RUNNER_TEMP/$name.onnx.json"
          done
          printf '%s\n' 'The cat sleeps on the sofa. The cat sleeps on the sofa.' | python -m piper -m "$RUNNER_TEMP/en_US-lessac-medium.onnx" -f "$RUNNER_TEMP/en-raw.wav"
          printf '%s\n' 'Мне нравится читать книги. Мне нравится читать книги.' | python -m piper -m "$RUNNER_TEMP/ru_RU-irina-medium.onnx" -f "$RUNNER_TEMP/ru-raw.wav"
          ffmpeg -loglevel error -i "$RUNNER_TEMP/en-raw.wav" -af 'adelay=500|500,apad=pad_dur=4' -ac 1 -ar 48000 "$RUNNER_TEMP/en.wav"
          ffmpeg -loglevel error -i "$RUNNER_TEMP/ru-raw.wav" -af 'adelay=500|500,apad=pad_dur=4' -ac 1 -ar 48000 "$RUNNER_TEMP/ru.wav"
          ./node_modules/.bin/esbuild qa/native-dictation/fixture.tsx --bundle --jsx=automatic --define:process.env.NODE_ENV='"production"' --outfile="$RUNNER_TEMP/fixture.js"
      - name: Install the official browser language packs in an empty profile
        run: node qa/native-dictation/probe.cjs prepare
      - name: Dictate with only loopback networking
        run: |
          sudo ip netns add vibeon-dictation
          sudo ip -n vibeon-dictation link set lo up
          trap 'sudo ip netns del vibeon-dictation' EXIT
          sudo ip netns exec vibeon-dictation sudo -u "$USER" env HOME="$HOME" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" node qa/native-dictation/probe.cjs offline
