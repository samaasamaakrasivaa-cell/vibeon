name: Delivery preflight

# CD-01: observe the existing delivery connection before activating releases.
# Only the daily tick or an explicit full-backup dispatch writes a VibeOn backup.
on:
  pull_request:
    paths:
      - .github/workflows/delivery-preflight.yml
      - deploy/release-preflight.sh
      - deploy/pt02-placementedit-check.sh
      - scripts/test-release-preflight.py
      - deploy/release-policy.json
  push:
    branches: [main]
    paths:
      - .github/workflows/delivery-preflight.yml
      - deploy/release-preflight.sh
      - deploy/pt02-placementedit-check.sh
      - scripts/test-release-preflight.py
      - deploy/release-policy.json
  schedule:
    - cron: "23 0 * * *"
    - cron: "23 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      full_backup:
        description: Run the idempotent daily VibeOn backup now
        type: boolean
        default: false
      storage_observation:
        description: Observe VibeOn disk capacity without changing the server
        type: boolean
        default: false
      pt02_placementedit_check:
        description: Check the fixed PT-02 inventory for editor overrides
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the read-only preflight and redaction
        run: |
          bash -n deploy/release-preflight.sh
          bash -n deploy/pt02-placementedit-check.sh
          python3 scripts/test-release-preflight.py
      - name: Exercise Docker metadata parsing on isolated fixtures
        env:
          CD01_REAL_DOCKER: '1'
        run: python3 scripts/test-release-preflight.py DockerMetadataTest

  inspect:
    needs: validate
    if: >-
      github.repository == 'samaasamaakrasivaa-cell/vibeon' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event.schedule == '23 0 * * *' || inputs.full_backup) && 25 || 5 }}
    concurrency:
      group: ${{ github.event_name == 'schedule' && github.event.schedule != '23 0 * * *' && 'vibeon-storage-observation' || 'server' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect existing VibeOn deployment without changing it
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          STORAGE_OBSERVATION: ${{ inputs.storage_observation }}
          PT02_PLACEMENTEDIT_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.pt02_placementedit_check }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SSH_KEY" || -z "$SSH_HOST" ]]; then
            echo 'Delivery connection is unavailable: SSH_KEY or SSH_HOST is missing.' >&2
            exit 1
          fi
          # Reject configuration injection; never print either secret.
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.:-]+$ && "$SSH_HOST" != -* ]] || {
            echo 'Delivery connection has an invalid host format.' >&2
            exit 1
          }
          DELIVERY_SSH_DIR=$(mktemp -d)
          trap 'rm -rf "$DELIVERY_SSH_DIR"' EXIT
          chmod 700 "$DELIVERY_SSH_DIR"
          printf '%s\n' "$SSH_KEY" > "$DELIVERY_SSH_DIR/id"
          chmod 600 "$DELIVERY_SSH_DIR/id"
          ssh-keyscan -T 15 "$SSH_HOST" > "$DELIVERY_SSH_DIR/known_hosts" 2>/dev/null
          test -s "$DELIVERY_SSH_DIR/known_hosts"
          printf 'Host srv\n  HostName %s\n  User root\n  IdentityFile %s/id\n  UserKnownHostsFile %s/known_hosts\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 15\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n' \
            "$SSH_HOST" "$DELIVERY_SSH_DIR" "$DELIVERY_SSH_DIR" > "$DELIVERY_SSH_DIR/config"
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$STORAGE_OBSERVATION" == true ]]; then
            capacity=$(ssh -F "$DELIVERY_SSH_DIR/config" srv 'python3 - probe 0 1' < deploy/release_capacity.py)
            CAPACITY="$capacity" python3 - <<'PY_CAPACITY'
          import json
          import os
          import sys
          from pathlib import Path

          report = json.loads(os.environ["CAPACITY"])
          if report.get("reason") == "release_already_running":
              print("VibeOn storage observation skipped during a release.")
              sys.exit(0)
          margin = report.get("minimum_space_margin_bytes")
          if type(margin) is not int or report.get("status") != "ready":
              print("::error::VibeOn storage is critical or unavailable. Check issue #67.")
              sys.exit(1)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"VibeOn bytes above the backup and recovery floor: {margin:,}\n")
          if margin < 2 * 1024 ** 3:
              print("::warning::VibeOn has less than 2 GiB above the backup and recovery floor. Check issue #67.")
          PY_CAPACITY
            exit 0
          fi
          # Only the allowlisted JSON summary reaches Actions. No server logs,
          # credentials, student records, complete inspect output or backups.
          if [[ "$PT02_PLACEMENTEDIT_CHECK" == true ]]; then
            if ! report=$(ssh -F "$DELIVERY_SSH_DIR/config" srv 'bash -s' < deploy/pt02-placementedit-check.sh 2>/dev/null); then
              echo 'The fixed PT-02 read-only check failed.' >&2
              exit 1
            fi
            if [[ ! "$report" =~ ^(0|[1-9][0-9]{0,2})\|(0|[1-9][0-9]?)$ ]]; then
              echo 'Unexpected PT-02 result format.' >&2
              exit 1
            fi
            IFS='|' read -r overlaps audio_overrides <<< "$report"
            if (( overlaps > 149 || audio_overrides > 20 || audio_overrides > overlaps )); then
              echo 'Unexpected PT-02 count range.' >&2
              exit 1
            fi
            printf 'PlacementEdit overlaps: %s\nListening audio overrides: %s\n' "$overlaps" "$audio_overrides"
            exit 0
          fi
          DELIVERY_PROXY_IMAGE=$(python3 -c 'import json,re; from pathlib import Path; p=Path("deploy/release-policy.json"); v=(json.loads(p.read_text()).get("shared_proxy_image") or "") if p.exists() else ""; assert not v or re.fullmatch(r"sha256:[0-9a-f]{64}",v); print(v)')
          ssh -F "$DELIVERY_SSH_DIR/config" srv "env VIBEON_EXPECTED_PROXY_IMAGE='$DELIVERY_PROXY_IMAGE' bash -s" < deploy/release-preflight.sh

      - name: Capture and verify the daily full VibeOn backup
        if: (github.event_name == 'schedule' && github.event.schedule == '23 0 * * *') || inputs.full_backup
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: python3 scripts/run-delivery.py --daily-full-backup
