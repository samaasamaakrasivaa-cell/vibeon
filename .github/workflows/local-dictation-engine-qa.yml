name: Isolated Vosk browser prototype
on:
  push:
    branches: [codex/ai-quality/dictation-local-engine-qa]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare public model packages and synthetic audio
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright-core vosk-browser@0.0.8
          python -m pip install --quiet piper-tts
          for speaker in en/en_US/lessac/medium/en_US-lessac-medium ru/ru_RU/irina/medium/ru_RU-irina-medium; do
            name="${speaker##*/}"
            curl -fsSL --retry 2 "https://huggingface.co/rhasspy/piper-voices/resolve/main/$speaker.onnx?download=true" -o "$RUNNER_TEMP/$name.onnx"
            curl -fsSL --retry 2 "https://huggingface.co/rhasspy/piper-voices/resolve/main/$speaker.onnx.json?download=true" -o "$RUNNER_TEMP/$name.onnx.json"
          done
          printf '%s\n' 'The cat sleeps on the sofa. The teacher checks the exercises.' | python -m piper -m "$RUNNER_TEMP/en_US-lessac-medium.onnx" -f "$RUNNER_TEMP/en.wav"
          printf '%s\n' 'Мне нравится читать книги. На уроке мы повторили прошедшее время.' | python -m piper -m "$RUNNER_TEMP/ru_RU-irina-medium.onnx" -f "$RUNNER_TEMP/ru.wav"
          python - <<'PYTHON'
          import os, wave
          import numpy as np
          for lang in ("en", "ru"):
              root = os.environ["RUNNER_TEMP"]
              with wave.open(root + "/" + lang + ".wav") as file:
                  assert file.getnchannels() == 1 and file.getsampwidth() == 2
                  raw = np.frombuffer(file.readframes(file.getnframes()), dtype="<i2")
                  duration = len(raw) / file.getframerate()
                  interpolated = np.interp(np.arange(round(duration * 48000)) / 48000,
                    np.arange(len(raw)) / file.getframerate(), raw).astype("<i2")
              samples = np.pad(interpolated, (48000, 72000))
              with wave.open(root + "/" + lang + "-mic.wav", "wb") as file:
                  file.setnchannels(1); file.setsampwidth(2); file.setframerate(48000)
                  file.writeframes(samples.tobytes())
          PYTHON
          curl -fsSL --max-time 20 https://alphacephei.com/vosk/models -o "$RUNNER_TEMP/vosk-catalog.html"
          python - <<'PYTHON'
          import os, re
          from pathlib import Path
          catalog = (Path(os.environ["RUNNER_TEMP"]) / "vosk-catalog.html").read_text()
          for name in ("vosk-model-small-en-us-0.15", "vosk-model-small-ru-0.22"):
              row, = [text for text in re.findall(r"<tr[^>]*>(.*?)</tr>", catalog, re.I | re.S) if name + ".zip" in text]
              assert re.search(r"Apache\s*2\.0", row, re.I), name
              print(name, "publisher catalog: Apache 2.0")
          PYTHON
          for item in en:vosk-model-small-en-us-0.15 ru:vosk-model-small-ru-0.22; do
            lang="${item%%:*}"
            model="${item#*:}"
            curl -fsSL --retry 2 --max-time 75 "https://alphacephei.com/vosk/models/$model.zip" -o "$RUNNER_TEMP/$model.zip"
            sha256sum "$RUNNER_TEMP/$model.zip"
            unzip -q "$RUNNER_TEMP/$model.zip" -d "$RUNNER_TEMP"
            find "$RUNNER_TEMP/$model" -maxdepth 1 -type f
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP" -cf - "$model" |
              gzip -n > "$RUNNER_TEMP/$lang.tar.gz"
            sha256sum "$RUNNER_TEMP/$lang.tar.gz"
          done
      - name: Recognize both synthetic samples in a browser with only loopback
        run: |
          sudo ip netns add vibeon-vosk
          sudo ip -n vibeon-vosk link set lo up
          trap 'sudo ip netns del vibeon-vosk' EXIT
          sudo ip netns exec vibeon-vosk sudo -u "$USER" env HOME="$HOME" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" node qa/native-dictation/vosk-control.cjs
